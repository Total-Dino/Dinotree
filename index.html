<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinotree</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#00ff00;font-family:Calibri,"Segoe UI",Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:10px 14px 8px;gap:7px;overflow:hidden}
#header{text-align:center;flex-shrink:0;order:1}
#header h1{font-size:20px;letter-spacing:3px;color:#00ff00}
#header p{font-size:10px;opacity:.5;letter-spacing:1px;margin-top:1px}
#header a{color:#00aa00;text-decoration:none}
#input-row{display:flex;flex-direction:row;align-items:stretch;gap:6px;flex-shrink:0;order:2;position:sticky;top:0;z-index:25;background:#000;padding-top:2px}
#input-field-wrap{position:relative;flex:1;min-width:0}
#btn-row{display:flex;gap:6px;flex-shrink:0}
#guess-input{width:100%;min-width:0;background:#000;color:#00ff00;border:1px solid #00aa00;padding:8px 10px;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:20px;outline:none;height:100%;box-sizing:border-box}
#guess-input:focus{border-color:#00ff00}
#guess-input::placeholder{color:#003300}
#suggestions{display:none;position:absolute;top:100%;left:0;right:0;margin-top:2px;background:#000;border:1px solid #00aa00;max-height:38vh;overflow-y:auto;z-index:30;-webkit-overflow-scrolling:touch}
#suggestions.show{display:block}
.sugg-item{padding:9px 10px;font-size:15px;color:#00dd00;font-family:Calibri,"Segoe UI",Arial,sans-serif;cursor:pointer;border-bottom:1px solid #002200}
.sugg-item:last-child{border-bottom:none}
.sugg-item:active,.sugg-item.active{background:#001a00;color:#00ff00}
button{background:#000;color:#00ff00;border:1px solid #00aa00;padding:5px 8px;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:10px;cursor:pointer;white-space:nowrap}
button:hover{background:#001a00;border-color:#00ff00}
#btn-row button{padding:0 10px}
#status{font-size:11px;color:#005500;flex-shrink:0;display:flex;gap:14px;padding-left:2px;order:4}
#message{font-size:14px;color:#cc3333;flex-shrink:0;min-height:18px;padding-left:2px;order:5}
/* Exactly one scroll region: #tree-wrap. Everything else is fixed-height chrome.
   The SVG is rendered at true 1:1 scale (see renderTree) — never CSS-stretched
   to fit the container, so node boxes/text stay a constant physical size no
   matter how many guesses have piled up. Only the layout's own spacing
   (line length) compresses; if it still doesn't fit, this scrolls instead
   of shrinking anything. */
#tree-wrap{flex:1;min-height:0;order:6;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
svg{display:block;margin:0 auto}
@media(pointer:fine){
  /* Search bar looks awkwardly long stretched across a wide monitor */
  #input-row{max-width:560px;margin:0 auto;width:100%}
  #message{max-width:560px;margin:0 auto;width:100%;padding-left:0}
}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);justify-content:center;align-items:center;z-index:50}
#overlay.show{display:flex}
#vbox{border:1px solid #00ff00;background:#000;padding:28px 32px;max-width:380px;width:90%;text-align:center}
#vbox h2{font-size:20px;margin-bottom:6px;letter-spacing:2px}
#vbox .vsub{font-size:12px;color:#00aa00;margin-bottom:16px;line-height:1.6}
#vbox a.vlink{display:inline-block;margin-top:10px;color:#00ff00;border:1px solid #00ff00;padding:7px 18px;font-size:12px;text-decoration:none;letter-spacing:1px}
#vbox a.vlink:hover{background:#001a00}
.vcls{display:inline-block;margin-top:10px;font-size:11px;color:#004400;cursor:pointer;letter-spacing:1px}
.vcls:hover{color:#00aa00}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>DINOTREE</h1>
    <p>A phylogenetic guessing game &mdash; <a href="https://totaldino.com" target="_blank">TotalDino.com</a></p>
  </div>
  <div id="input-row">
    <div id="input-field-wrap">
      <input type="text" id="guess-input" placeholder="Enter a dinosaur genus..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div id="suggestions"></div>
    </div>
    <div id="btn-row">
      <button onclick="giveHint()">HINT</button>
      <button onclick="giveUp()">GIVE UP</button>
    </div>
  </div>
  <div id="status">
    <span id="s-hints"></span>
  </div>
  <div id="message"></div>
  <div id="tree-wrap">
    <svg id="tree-svg" preserveAspectRatio="xMidYMin meet"></svg>
  </div>
</div>
<div id="overlay">
  <div id="vbox">
    <h2 id="v-title"></h2>
    <div class="vsub" id="v-sub"></div>
    <a class="vlink" id="v-link" href="#" target="_blank">VIEW ON TOTAL DINO &rarr;</a><br>
    <span class="vcls" onclick="document.getElementById('overlay').classList.remove('show')">&mdash; close &mdash;</span>
  </div>
</div>

const ALL_NAMES = TAXA.map(t => t.name).sort((a,b) => a.localeCompare(b));
const suggBox = document.getElementById('suggestions');
let suggItems = [];

function hideSuggestions() {
  suggBox.classList.remove('show');
  suggBox.innerHTML = '';
  suggItems = [];
}

function showSuggestions(query) {
  const q = query.trim().toLowerCase();
  if (!q) { hideSuggestions(); return; }
  const guessedNames = new Set(S.guesses.map(g => g.name.toLowerCase()));
  const starts = [];
  const contains = [];
  for (const name of ALL_NAMES) {
    if (guessedNames.has(name.toLowerCase())) continue;
    const low = name.toLowerCase();
    if (low.startsWith(q)) starts.push(name);
    else if (low.includes(q)) contains.push(name);
    if (starts.length >= 3) break;
  }
  suggItems = starts.concat(contains).slice(0, 3);
  if (suggItems.length === 0) { hideSuggestions(); return; }
  suggBox.innerHTML = suggItems.map(n => '<div class="sugg-item">' + n + '</div>').join('');
  suggBox.classList.add('show');
}

// ── State ────────────────────────────────────────────────────
const S = { target:null, guesses:[], revealed:0, hints:0, won:false, over:false, hintNodes:new Set() };
let drawnNodes = null; // tracks which nodes have already been rendered (for animation)
let prevPositions = null; // name -> {x,y,w,h,font} from the last render, for the reposition/resize tween
let prevVW = null, prevVH = null; // the SVG's own last dimensions — tweened too, so the canvas doesn't snap-resize underneath the smooth node animation
let activeTweenFinish = null; // if a tween is still running when a new guess comes in, snap it to completion first — otherwise "old" position data would reflect an unfinished animation's target, not what's actually on screen

function dateHash(s) {
  let h = 0;
  for (const c of s) h = Math.imul(h,31) + c.charCodeAt(0) | 0;
  return Math.abs(h);
}

function init() {
  const today = new Date().toISOString().split('T')[0];
  // TARGET_POOL: curated well-known genera; TAXA stays full for guessing
  const poolTargets = TARGET_POOL.map(name => BY_NAME[name.toLowerCase()]).filter(Boolean);
  S.target = poolTargets[dateHash(today) % poolTargets.length];
  renderTree(); updateStatus();
  const inputEl = document.getElementById('guess-input');
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      hideSuggestions();
      if (window.matchMedia('(pointer: coarse)').matches) inputEl.blur(); // dismiss the on-screen keyboard on mobile
      submitGuess();
      if (!window.matchMedia('(pointer: coarse)').matches) inputEl.focus(); // stay ready for the next guess on desktop
    }
  });
  inputEl.addEventListener('input', () => showSuggestions(inputEl.value));
  inputEl.addEventListener('blur', () => { setTimeout(hideSuggestions, 150); }); // delay so a tap on a suggestion still registers
  suggBox.addEventListener('mousedown', e => e.preventDefault()); // keep focus/keyboard open through the tap
  suggBox.addEventListener('click', e => {
    const item = e.target.closest('.sugg-item');
    if (!item) return;
    inputEl.value = item.textContent;
    hideSuggestions();
    inputEl.focus();
  });
  document.getElementById('overlay').addEventListener('click', function(e){ if(e.target===this) this.classList.remove('show'); });
}

// ── LCA ─────────────────────────────────────────────────────
function findLCA(a, b) {
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  return i - 1;
}

// ── Actions ──────────────────────────────────────────────────
function submitGuess() {
  if (S.won || S.over) return;
  const inp = document.getElementById('guess-input');
  const raw = inp.value.trim(); inp.value = '';
  if (!raw) return;
  const taxon = BY_NAME[raw.toLowerCase()];
  if (!taxon) { setMsg('Oops! The entered dinosaur name is invalid. Perhaps you entered a pterosaur, or made a ptypo?'); return; }
  if (S.guesses.find(g => g.name === taxon.name)) { setMsg(taxon.name + ' already guessed.'); return; }
  setMsg('');
  if (taxon.name === S.target.name) {
    S.won = true; S.revealed = S.target.lineage.length - 1;
    renderTree(); updateStatus(); setTimeout(showVictory, 500); return;
  }
  const lca = findLCA(taxon.lineage, S.target.lineage);
  if (lca > S.revealed) S.revealed = lca;
  S.guesses.push({name: taxon.name, lineage: taxon.lineage, lcaIdx: lca});
  renderTree(); updateStatus();
}

function giveHint() {
  if (S.won || S.over || S.revealed >= S.target.lineage.length - 2) return;
  S.revealed++;
  S.hints++;
  // Force only this specific node visible — not the whole path
  S.hintNodes.add(S.target.lineage[S.revealed]);
  renderTree(); updateStatus();
}

function giveUp() {
  if (S.won || S.over) return;
  S.over = true; S.revealed = S.target.lineage.length - 1;
  renderTree(); updateStatus(); setMsg('The answer was: ' + S.target.name);
}

function setMsg(t) { document.getElementById('message').textContent = t; }

function updateStatus() {
  document.getElementById('s-hints').textContent = S.hints > 0 ? S.hints + ' hint' + (S.hints>1?'s':'') : '';
}

// ── UNIFIED TREE ─────────────────────────────────────────────
// Builds a tree from ALL guess lineages + target revealed lineage.
// A node is VISIBLE only if it has 2+ leaves beneath it (earned through guesses)
// OR it is the root or a leaf itself.

function buildUnifiedTree() {
  const nmap = new Map(); // name → node object

  function getN(name) {
    if (!nmap.has(name)) nmap.set(name, {name, ch: new Map(), isLeaf:false, isTarget:false, depth:-1, leafCount:0});
    return nmap.get(name);
  }

  function addLineage(lineage, leafIsTarget) {
    for (let i = 0; i < lineage.length; i++) {
      const node = getN(lineage[i]);
      if (i > 0) {
        const par = getN(lineage[i-1]);
        if (!par.ch.has(lineage[i])) par.ch.set(lineage[i], node);
      }
    }
    const last = getN(lineage[lineage.length-1]);
    last.isLeaf = true;
    if (leafIsTarget) last.isTarget = true;
  }

  // Target revealed lineage ending in special marker
  const targetEnd = '???';
  const targetPath = [...S.target.lineage.slice(0, S.revealed + 1), targetEnd];
  addLineage(targetPath, true);

  // All wrong guesses
  for (const g of S.guesses) addLineage(g.lineage, false);

  // Assign depths
  function setDepth(name, d) {
    const node = getN(name);
    if (node.depth === -1) node.depth = d;
    for (const [,c] of node.ch) setDepth(c.name, d+1);
  }
  setDepth('Dinosauria', 0);

  // Count leaves per subtree
  function cLeaves(node) {
    if (node.leafCount > 0) return node.leafCount;
    if (node.isLeaf || node.ch.size === 0) { node.leafCount = 1; return 1; }
    let total = 0;
    for (const [,c] of node.ch) total += cLeaves(c);
    node.leafCount = total;
    return total;
  }
  cLeaves(getN('Dinosauria'));

  return getN('Dinosauria');
}

// Build visible tree: skip nodes with only 1 leaf (unique path segments)
// keeping only branch points and leaves
function buildVisible(rawRoot) {
  function hasTarget(vnode) {
    if (vnode.isTarget) return true;
    return vnode.children.some(c => hasTarget(c));
  }

  function isVis(rnode) {
    return rnode.name === 'Dinosauria' || rnode.isLeaf || rnode.ch.size >= 2 || S.hintNodes.has(rnode.name);
  }

  function findNext(rnode) {
    if (isVis(rnode)) return build(rnode);
    // Pass through single-child invisible nodes
    const results = [];
    for (const [,c] of rnode.ch) { const r = findNext(c); if(r) results.push(r); }
    return results.length === 1 ? results[0] : (results.length === 0 ? null : results[0]);
  }

  function build(rnode) {
    const vn = {name: rnode.name, children: [], isLeaf: rnode.isLeaf, isTarget: rnode.isTarget, origDepth: rnode.depth};
    for (const [,c] of rnode.ch) {
      const vc = findNext(c);
      if (vc) vn.children.push(vc);
    }
    // Sort: target path goes last (rightmost)
    vn.children.sort((a,b) => {
      const at = hasTarget(a), bt = hasTarget(b);
      return at === bt ? 0 : (at ? 1 : -1);
    });
    return vn;
  }

  return build(rawRoot);
}

// ── LAYOUT ───────────────────────────────────────────────────
// Real collision-aware layout: every node's horizontal position is
// resolved by checking actual rendered rectangles (and the connecting
// lines themselves) against everything already placed, shifting right
// only as much as truly needed to clear something. This is what
// GUARANTEES lines never cross: siblings are always processed in order,
// and anything placed later can never end up positioned to the left of
// something earlier wherever they'd actually interfere — whether that's
// two boxes overlapping, or a deep branch's own connecting line cutting
// through an earlier branch's boxes on its way down. When two subtrees
// truly don't interfere at all, the required shift comes out to zero on
// its own, so branches naturally "float" into unused vertical space
// without needing to be told to.

function packCluster(wl, maxCols) {
  const n = wl.length;
  const naturalCols = n <= 2 ? n : (n <= 6 ? 2 : 3);
  const cols = Math.max(1, Math.min(maxCols, naturalCols));
  wl.forEach((g, i) => {
    g.col = i % cols;
    g.row = Math.floor(i / cols);
    // Small alternating-row nudge, safely inside this cluster's own
    // reserved columns, for a rounder silhouette.
    g.stagger = (cols > 1 && g.row % 2 === 1) ? 0.18 : 0;
  });
  return cols;
}

// Minimum rightward shift so that every rect in `moving` clears every
// rect in `fixed` it would otherwise overlap (with `gap` clearance).
function requiredShift(fixed, moving, gap) {
  let shift = 0;
  for (const f of fixed) {
    for (const m of moving) {
      if (f.y0 < m.y1 && m.y0 < f.y1) { // vertical ranges overlap
        const need = (f.x1 - m.x0) + gap;
        if (need > shift) shift = need;
      }
    }
  }
  return shift;
}

function layoutTree(root, LH, NH, SGAP, maxCols, nw, labelOf, gap) {
  const STACK_GAP = LH * 0.35; // breathing room between stacked sibling branches

  // Lays out `node`'s entire subtree in its own local frame (roughly
  // centered near x=0) and returns { rects, relX } — rects covers every
  // rectangle anywhere in this subtree, already in their final relative
  // positions for this frame.
  function layout(node, y) {
    node.absY = y;
    if (node.children.length === 0) {
      const w = nw(labelOf(node));
      node.lx = 0;
      return { rects: [{ x0: -w/2, x1: w/2, y0: y, y1: y + NH + SGAP }], relX: 0 };
    }

    const wl = node.children.filter(c => c.isLeaf && !c.isTarget);
    const ot = node.children.filter(c => !c.isLeaf || c.isTarget);
    const cy = y + LH;
    let rects = [];
    let childXs = [];

    if (wl.length > 0) {
      const cols = packCluster(wl, maxCols);
      const widest = Math.max(...wl.map(g => nw(labelOf(g))));
      const pitch = widest + gap;
      wl.forEach(g => {
        const w = nw(labelOf(g));
        const gx = (g.col - (cols - 1) / 2 + g.stagger) * pitch;
        const gy = cy + g.row * (NH + SGAP);
        g.lx = gx; g.absY = gy;
        rects.push({ x0: gx - w/2, x1: gx + w/2, y0: gy, y1: gy + NH + SGAP });
        childXs.push(gx);
      });
    }

    let cursorY = cy;
    ot.forEach((o, i) => {
      const startY = (i === 0) ? cy : cursorY;
      const sub = layout(o, startY);
      let shift = requiredShift(rects, sub.rects, gap);
      if (i > 0) {
        // Also require the connecting line's own vertical corridor (from
        // where this stack began down to this branch's deepest point) to
        // stay clear of everything already drawn — this is what stops a
        // deep stacked branch's line from visually crossing through an
        // earlier branch's boxes.
        const halfW = nw(labelOf(o)) / 2;
        const deepest = sub.rects.length ? Math.max(...sub.rects.map(r => r.y1)) : startY + NH + SGAP;
        const corridor = [{ x0: sub.relX - halfW, x1: sub.relX + halfW, y0: cy, y1: deepest }];
        shift = Math.max(shift, requiredShift(rects, corridor, gap));
      }
      if (shift !== 0) shiftSubtree(o, shift);
      const shiftedRects = sub.rects.map(r => ({ x0: r.x0 + shift, x1: r.x1 + shift, y0: r.y0, y1: r.y1 }));
      rects = rects.concat(shiftedRects);
      childXs.push(o.lx);
      const deepestY = shiftedRects.length ? Math.max(...shiftedRects.map(r => r.y1)) : startY + NH + SGAP;
      cursorY = deepestY + STACK_GAP;
    });

    const relX = childXs.length ? childXs.reduce((a,b)=>a+b,0) / childXs.length : 0;
    node.lx = relX;
    const w = nw(labelOf(node));
    rects.push({ x0: relX - w/2, x1: relX + w/2, y0: y, y1: y + NH + SGAP });
    return { rects, relX };
  }

  // Adds `shift` to node.lx and every descendant's lx — they were all
  // set during the nested recursive call, in the frame that's now moving.
  function shiftSubtree(node, shift) {
    node.lx += shift;
    node.children.forEach(c => shiftSubtree(c, shift));
  }

  const result = layout(root, 14);
  let minX = Infinity, maxX = -Infinity, maxY = 0;
  result.rects.forEach(r => {
    minX = Math.min(minX, r.x0);
    maxX = Math.max(maxX, r.x1);
    maxY = Math.max(maxY, r.y1);
  });
  return { minX, maxX, maxY };
}
// ── RENDER ───────────────────────────────────────────────────
function renderTree() {
  if (activeTweenFinish) { activeTweenFinish(); activeTweenFinish = null; }
  const rawRoot = buildUnifiedTree();
  const visRoot = buildVisible(rawRoot);
  const isMobile = window.matchMedia('(pointer: coarse)').matches;
  const BASE_NH       = 40;
  const BASE_LH       = isMobile ? 88  : 100;
  const BASE_SGAP     = 8;
  const BASE_FONT     = 16;
  const BASE_GAP      = isMobile ? 14  : 20;   // base clearance between adjacent boxes/branches
  const GUTTER        = isMobile ? 10  : 14;   // fixed side padding beyond the outermost box
  const MAX_CLUSTER_COLS = 3;

  // Compression floors. Phase 1 (s: 0→1) shrinks gaps twice as fast as
  // boxes, down to a "still comfortable" box floor (BSCALE_MID). If the
  // tree still doesn't fit at that point, phase 2 (s: 1→2) lets boxes keep
  // shrinking too, all the way to BSCALE_FLOOR — this is what guarantees
  // the tree can never overflow the screen width, even in dense cases.
  const GSCALE_FLOOR = 0.06;
  const BSCALE_MID   = 0.55;
  const BSCALE_FLOOR = 0.22;

  function nwAt(lbl, scale) { return Math.max(70, lbl.length * 9.5 + 26) * scale; }
  function labelOf(n) { return (n.isTarget && (S.won || S.over)) ? S.target.name : n.name; }

  function paramsFromS(s) {
    if (s <= 1) return { gScale: 1 - s * (1 - GSCALE_FLOOR), bScale: 1 - s * (1 - BSCALE_MID) / 2 };
    const s2 = Math.min(s - 1, 1);
    return { gScale: GSCALE_FLOOR, bScale: BSCALE_MID - s2 * (BSCALE_MID - BSCALE_FLOOR) };
  }

  const treeWrapEl = document.getElementById('tree-wrap');
  const availW = treeWrapEl.clientWidth || (isMobile ? 340 : 800);

  // Actually runs the real collision-aware layout at a trial compression
  // level and measures the resulting width — this is the true width, not
  // an estimate, since box size AND gap size both genuinely change what
  // the algorithm produces.
  function widthAt(s) {
    const { gScale, bScale } = paramsFromS(s);
    const nhS = BASE_NH * bScale, lhS = BASE_LH * bScale, sgapS = BASE_SGAP * bScale;
    const gapS = Math.max(4, BASE_GAP * gScale);
    const nwS = lbl => nwAt(lbl, bScale);
    const { minX, maxX } = layoutTree(visRoot, lhS, nhS, sgapS, MAX_CLUSTER_COLS, nwS, labelOf, gapS);
    return (maxX - minX) + GUTTER * 2;
  }

  // Binary search for the smallest s (least total compression) that fits —
  // guarantees the tree stays within the screen instead of overflowing.
  let s;
  if (widthAt(0) <= availW) {
    s = 0; // no compression needed
  } else if (widthAt(2) > availW) {
    s = 2; // pathological case — best effort even at max compression
  } else {
    let lo = 0, hi = 2;
    for (let i = 0; i < 20; i++) {
      const mid = (lo + hi) / 2;
      if (widthAt(mid) <= availW) hi = mid; else lo = mid;
    }
    s = hi;
  }

  const { gScale, bScale } = paramsFromS(s);
  const NH   = BASE_NH * bScale;
  const LH   = BASE_LH * bScale;
  const SGAP = BASE_SGAP * bScale;
  const FONT = BASE_FONT * bScale;
  const GAP  = Math.max(4, BASE_GAP * gScale);
  function nw(lbl) { return nwAt(lbl, bScale); }

  // Final real layout pass at the chosen scale — this is what actually
  // resolves every node's position for rendering.
  const { minX, maxX, maxY } = layoutTree(visRoot, LH, NH, SGAP, MAX_CLUSTER_COLS, nw, labelOf, GAP);

  const contentW = maxX - minX;
  const sidePad = Math.max(GUTTER, (200 - contentW) / 2); // symmetric padding even when the 200px floor kicks in for tiny trees
  const VW = contentW + sidePad * 2;
  const VH = maxY + 20;
  function px(n) { return n.lx - minX + sidePad; }
  function py(n) { return n.absY; }

  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function onTargetPath(n) { return n.isTarget || n.children.some(c => onTargetPath(c)); }

  const firstRender = drawnNodes === null;
  if (firstRender) drawnNodes = new Set();

  const skipReposition = !firstRender && S.guesses.length <= 1; // the very first guess is a "reveal", not a reposition
  const oldPositions = skipReposition ? null : prevPositions;
  let edges = '', nodes = '';
  let newChainIdx = 0; // increments once per new edge, in root-to-leaf order
  const tweenNodeQueue = []; // existing nodes whose position/size changed this render
  const tweenEdgeQueue = []; // existing edges whose endpoints changed this render
  const newEdgeFollowQueue = []; // new edges growing from an existing (possibly still-moving) parent

  function draw(n, incomingChainIdx) {
    const x = px(n), y = py(n);
    const existedBefore = drawnNodes.has(n.name) && !firstRender;
    const prevSelf = (existedBefore && oldPositions) ? oldPositions.get(n.name) : null;

    for (const c of n.children) {
      const cx = px(c), cy = py(c);
      const edgeNew = !drawnNodes.has(c.name) && !firstRender;
      const chainIdx = edgeNew ? newChainIdx++ : null;
      const chainAttr = chainIdx !== null ? ' data-chain="' + chainIdx + '"' : '';
      const prevChild = (!edgeNew && oldPositions) ? oldPositions.get(c.name) : null;
      const edgeMoved = !edgeNew && prevSelf && prevChild;

      // Render moving edges at their OLD shape first (no flash), then tween
      // to the new one; brand-new edges still grow in via stroke-dashoffset.
      const ex = edgeMoved ? prevSelf.x : x, ey = edgeMoved ? prevSelf.y : y, enh = edgeMoved ? prevSelf.h : NH;
      const ecx = edgeMoved ? prevChild.x : cx, ecy = edgeMoved ? prevChild.y : cy, ech = edgeMoved ? prevChild.h : NH;
      const emy = (ey + enh/2 + ecy - ech/2) / 2;
      edges += '<path d="M' + ex + ',' + (ey+enh/2) + ' C' + ex + ',' + emy + ' ' + ecx + ',' + emy + ' ' + ecx + ',' + (ecy-ech/2) + '" class="edge' + (edgeNew ? ' enew' : '') + '"' + chainAttr + ' data-ekey="' + esc(c.name) + '"/>';
      if (edgeMoved) {
        tweenEdgeQueue.push({ key: c.name, prevN: prevSelf, prevC: prevChild, curN: { x, y, h: NH }, curC: { x: cx, y: cy, h: NH } });
      } else if (edgeNew && prevSelf) {
        // The parent already existed (and may itself be mid-tween) — keep
        // this new line's origin glued to the parent's CURRENT position
        // every frame, so it never looks detached from the box it's
        // growing out of. The child end is brand-new, so it stays fixed.
        newEdgeFollowQueue.push({ key: c.name, prevN: prevSelf, curN: { x, y, h: NH }, childX: cx, childY: cy, childH: NH });
      }
      draw(c, chainIdx);
    }

    let bc = 'sn', tc = 'st';
    const isTip = n.isTarget;
    if      (isTip && S.won)   { bc = 'wn'; tc = 'wt'; }
    else if (isTip && S.over)  { bc = 'ln'; tc = 'lt'; }
    else if (isTip)            { bc = 'tn'; }
    else if (n.isLeaf)         { bc = 'bn'; tc = 'bt'; }
    else if (onTargetPath(n))  { bc = 'pn'; }

    const lbl = (isTip && (S.won || S.over)) ? S.target.name : n.name;
    const w = nw(lbl);
    const isNew = !existedBefore;
    const anim = isNew ? ' nnew' : '';
    const nodeMoved = !isNew && prevSelf && (prevSelf.x !== x || prevSelf.y !== y || prevSelf.w !== w || prevSelf.h !== NH || prevSelf.font !== FONT);
    // A node's own reveal is tied to the chain index of the edge that grew into it
    const nodeChainAttr = (isNew && incomingChainIdx !== null) ? ' data-chain="' + incomingChainIdx + '"' : '';
    const keyAttr = ' data-key="' + esc(n.name) + '"';

    // Moving nodes render at their OLD position/size/font first (so the
    // very first paint matches where they already were, no jump), then get
    // tweened to the new spot right after insertion.
    const rx = nodeMoved ? prevSelf.x : x, ry = nodeMoved ? prevSelf.y : y;
    const rw = nodeMoved ? prevSelf.w : w, rh = nodeMoved ? prevSelf.h : NH;
    const rf = nodeMoved ? prevSelf.font : FONT;
    nodes += '<rect x="' + (rx-rw/2) + '" y="' + ry + '" width="' + rw + '" height="' + rh + '" rx="3" class="' + bc + anim + '"' + nodeChainAttr + keyAttr + '/>';
    nodes += '<text x="' + rx + '" y="' + (ry+rh/2) + '" text-anchor="middle" dominant-baseline="middle" class="' + tc + anim + '" font-size="' + rf.toFixed(1) + '"' + nodeChainAttr + keyAttr + '>' + esc(lbl) + '</text>';
    if (nodeMoved) {
      tweenNodeQueue.push({ key: n.name, prev: prevSelf, cur: { x, y, w, h: NH, font: FONT } });
    }
  }

  draw(visRoot, null);

  // Snapshot this render's positions (for the NEXT render's tween), while
  // also tracking which nodes have been drawn before (for grow-in vs flip).
  const newPositions = new Map();
  function collect(n) {
    drawnNodes.add(n.name);
    newPositions.set(n.name, { x: px(n), y: py(n), w: nw(labelOf(n)), h: NH, font: FONT });
    n.children.forEach(collect);
  }
  collect(visRoot);
  prevPositions = newPositions;

  const svg = document.getElementById('tree-svg');
  svg.setAttribute('viewBox', '0 0 ' + VW + ' ' + VH);
  svg.setAttribute('width', VW);
  svg.setAttribute('height', VH);
  svg.innerHTML = '<defs><style>'
    + '.edge{fill:none;stroke:#003800;stroke-width:3}'
    + '.sn{fill:#080808;stroke:#006600;stroke-width:1}'
    + '.pn{fill:#001a00;stroke:#00cc00;stroke-width:1.5}'
    + '.bn{fill:#050505;stroke:#005500;stroke-width:1;stroke-dasharray:4 2}'
    + '.tn{fill:#001400;stroke:#00ff00;stroke-width:1.5;stroke-dasharray:5 2}'
    + '.wn{fill:#00ff00;stroke:#00ff00;stroke-width:2}'
    + '.ln{fill:#1a0000;stroke:#aa2200;stroke-width:1.5}'
    + '.st{fill:#009900;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-style:italic}'
    + '.bt{fill:#006600;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-style:italic}'
    + '.wt{fill:#000;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-weight:bold;font-style:italic}'
    + '.lt{fill:#aa2200;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-style:italic}'
    + '.nnew{opacity:0}'
    + '</style></defs>' + edges + nodes;

  // Grow new edges outward from parent to child along the actual curve.
  // Each edge waits for its parent's edge (same chain) to finish before it
  // starts growing, so a lower clade's line never starts until the branch
  // above it has fully drawn.
  const EDGE_S = 0.85;   // seconds per edge segment
  const NODE_S = 0.4;    // seconds for a node's fade-in
  svg.querySelectorAll('path.enew').forEach(path => {
    const idx = Number(path.dataset.chain);
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    path.getBoundingClientRect(); // force reflow so the starting state takes hold
    path.style.transition = 'stroke-dashoffset ' + EDGE_S + 's ease';
    path.style.transitionDelay = (idx * EDGE_S) + 's';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => { path.style.strokeDashoffset = '0'; });
    });
  });

  // Nodes simply fade in (no movement) right as the edge feeding them lands.
  svg.querySelectorAll('.nnew').forEach(el => {
    const idx = el.dataset.chain !== undefined ? Number(el.dataset.chain) : 0;
    el.style.transition = 'opacity ' + NODE_S + 's ease';
    el.style.transitionDelay = ((idx + 1) * EDGE_S) + 's';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => { el.style.opacity = '1'; });
    });
  });

  // Everything that already existed before this guess smoothly slides and
  // resizes into its new spot, instead of jumping there — this is what
  // makes the rest of the tree settle/shrink to make room for new growth,
  // rather than snapping. Brand-new nodes/edges are untouched by this;
  // they still use the grow/fade-in above. (These elements were already
  // rendered at their OLD position/shape by draw() above — no flash.)
  const dimsChanged = !skipReposition && prevVW !== null && (prevVW !== VW || prevVH !== VH);
  if (tweenNodeQueue.length > 0 || tweenEdgeQueue.length > 0 || newEdgeFollowQueue.length > 0 || dimsChanged) {
    const rectByKey = {}, textByKey = {}, edgeByKey = {};
    svg.querySelectorAll('rect[data-key]').forEach(el => { rectByKey[el.getAttribute('data-key')] = el; });
    svg.querySelectorAll('text[data-key]').forEach(el => { textByKey[el.getAttribute('data-key')] = el; });
    svg.querySelectorAll('path[data-ekey]').forEach(el => { edgeByKey[el.getAttribute('data-ekey')] = el; });

    const tweenNodes = tweenNodeQueue.map(tn => ({ ...tn, rectEl: rectByKey[tn.key], textEl: textByKey[tn.key] }))
      .filter(tn => tn.rectEl || tn.textEl);
    const tweenEdges = tweenEdgeQueue.map(te => ({ ...te, pathEl: edgeByKey[te.key] }))
      .filter(te => te.pathEl);
    const followEdges = newEdgeFollowQueue.map(fe => ({ ...fe, pathEl: edgeByKey[fe.key] }))
      .filter(fe => fe.pathEl);

    // Canvas itself: if it's about to resize, start the frame from the OLD
    // size (matching what's already on screen) and tween to the new one in
    // lockstep with everything else, instead of snapping underneath it.
    if (dimsChanged) {
      svg.setAttribute('viewBox', '0 0 ' + prevVW + ' ' + prevVH);
      svg.setAttribute('width', prevVW);
      svg.setAttribute('height', prevVH);
    }

    if (tweenNodes.length > 0 || tweenEdges.length > 0 || followEdges.length > 0 || dimsChanged) {
      const DURATION = 1000;
      const t0 = performance.now();
      const ease = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; // easeInOutQuad
      let stopped = false;

      function apply(e) {
        tweenNodes.forEach(tn => {
          const x = tn.prev.x + (tn.cur.x - tn.prev.x) * e;
          const y = tn.prev.y + (tn.cur.y - tn.prev.y) * e;
          const w = tn.prev.w + (tn.cur.w - tn.prev.w) * e;
          const h = tn.prev.h + (tn.cur.h - tn.prev.h) * e;
          const f = tn.prev.font + (tn.cur.font - tn.prev.font) * e;
          if (tn.rectEl) {
            tn.rectEl.setAttribute('x', x - w/2);
            tn.rectEl.setAttribute('y', y);
            tn.rectEl.setAttribute('width', w);
            tn.rectEl.setAttribute('height', h);
          }
          if (tn.textEl) {
            tn.textEl.setAttribute('x', x);
            tn.textEl.setAttribute('y', y + h/2);
            tn.textEl.setAttribute('font-size', f.toFixed(1));
          }
        });
        tweenEdges.forEach(te => {
          const nx = te.prevN.x + (te.curN.x - te.prevN.x) * e;
          const ny = te.prevN.y + (te.curN.y - te.prevN.y) * e;
          const nh = te.prevN.h + (te.curN.h - te.prevN.h) * e;
          const cx = te.prevC.x + (te.curC.x - te.prevC.x) * e;
          const cy = te.prevC.y + (te.curC.y - te.prevC.y) * e;
          const ch = te.prevC.h + (te.curC.h - te.prevC.h) * e;
          const my = (ny + nh/2 + cy - ch/2) / 2;
          te.pathEl.setAttribute('d', 'M' + nx + ',' + (ny+nh/2) + ' C' + nx + ',' + my + ' ' + cx + ',' + my + ' ' + cx + ',' + (cy-ch/2));
        });
        followEdges.forEach(fe => {
          // Parent side tracks its own tween; child side (brand new) is fixed.
          const nx = fe.prevN.x + (fe.curN.x - fe.prevN.x) * e;
          const ny = fe.prevN.y + (fe.curN.y - fe.prevN.y) * e;
          const nh = fe.prevN.h + (fe.curN.h - fe.prevN.h) * e;
          const my = (ny + nh/2 + fe.childY - fe.childH/2) / 2;
          fe.pathEl.setAttribute('d', 'M' + nx + ',' + (ny+nh/2) + ' C' + nx + ',' + my + ' ' + fe.childX + ',' + my + ' ' + fe.childX + ',' + (fe.childY-fe.childH/2));
        });
        if (dimsChanged) {
          const vw = prevVW + (VW - prevVW) * e;
          const vh = prevVH + (VH - prevVH) * e;
          svg.setAttribute('viewBox', '0 0 ' + vw + ' ' + vh);
          svg.setAttribute('width', vw);
          svg.setAttribute('height', vh);
        }
      }

      function frame(now) {
        if (stopped) return;
        const raw = Math.min(1, (now - t0) / DURATION);
        apply(ease(raw));
        if (raw < 1) requestAnimationFrame(frame);
        else activeTweenFinish = null; // completed naturally
      }
      activeTweenFinish = () => { stopped = true; apply(1); }; // called if a new guess interrupts this tween
      requestAnimationFrame(frame);
    }
  }

  prevVW = VW; prevVH = VH;

  // If the newly-grown part of the tree would land below what's currently
  // visible (e.g. off-screen or under the keyboard), scroll just enough to
  // bring the start of it into view so the growth animation is actually
  // Always bring the start of newly-grown content near the top of the
  // visible tree area after a guess. Simpler and more reliable than trying
  // to precisely detect what's hidden behind the keyboard — and since the
  // keyboard only ever covers the BOTTOM of the screen, pushing new growth
  // toward the top guarantees it clears the keyboard too.
  if (!firstRender) {
    const newYs = [];
    svg.querySelectorAll('.nnew').forEach(el => {
      const yAttr = el.getAttribute('y');
      if (yAttr !== null) newYs.push(parseFloat(yAttr));
    });
    if (newYs.length > 0) {
      const newTop = Math.min(...newYs);
      const PAD = 20;
      // Small delay: the input was just blurred to dismiss the keyboard,
      // and that collapse animates over a couple hundred ms — scrolling
      // right away would still be measuring against the keyboard-up
      // layout. Waiting lets the scroll land after things settle.
      setTimeout(() => {
        treeWrapEl.scrollTo({ top: Math.max(0, newTop - PAD), behavior: 'smooth' });
      }, 150);
    }
  }
}

  const n = S.guesses.length;
  document.getElementById('v-title').textContent = S.target.name;
  document.getElementById('v-sub').textContent =
    'Identified in ' + n + ' guess' + (n!==1?'es':'') +
    (S.hints > 0 ? ' + ' + S.hints + ' hint' + (S.hints>1?'s':'') : '') + '.';
  const linkEl = document.getElementById('v-link');
  if (TOTALDINO_PAGES.has(S.target.name)) {
    const slug = S.target.name.toLowerCase().replace(/ /g,'-');
    linkEl.href = 'https://totaldino.com/dino/' + slug;
    linkEl.textContent = 'VIEW ON TOTAL DINO \u2192';
  } else {
    linkEl.href = 'https://en.wikipedia.org/wiki/' + encodeURIComponent(S.target.name);
    linkEl.textContent = 'VIEW ON WIKIPEDIA \u2192';
  }
  document.getElementById('overlay').classList.add('show');
}
