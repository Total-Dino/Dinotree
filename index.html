<style>
  @media (max-width: 750px) {
    html, body { background: #000 !important; overscroll-behavior-y: none !important; }
    #SITE_HEADER { position: relative !important; }
    #SITE_FOOTER { display: none !important; }

    #bgLayers_comp-mn1ezx7p1 {
      background: #000 !important;
    }
    #bgLayers_comp-mn1ezx7p1 [data-testid="colorUnderlay"] {
      background: transparent !important;
    }

    #comp-mtu6cfia {
      position: sticky;
      top: 0;
      z-index: 9999;
      background: rgba(0,0,0,0);
      transition: background-color .12s linear;
    }
    #comp-mtu6cfia.dt-docked {
      position: fixed !important;
      top: 0; left: 0; right: 0;
    }

    .dt-howitworks-wrap {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    #comp-mn1ezx7p1 {
      position: sticky !important;
      z-index: 9998 !important;
      background: #000 !important;
      overflow: hidden;
    }

    #comp-mswdpkzk {
      overscroll-behavior-y: contain;
    }

    body.dt-kb-lock {
      position: fixed !important;
      left: 0;
      right: 0;
      overflow: hidden;
    }
    html.dt-kb-lock {
      overflow: hidden;
    }
  }
</style>

<script>
(function () {
  var MOBILE = '(max-width: 750px)';
  var FADE_PX = 30;
  var CATCH_PX = 15;
  var TICK_MS = 150;
  var LOCK_SLIDE_MS = 260;
  var GAP_TOLERANCE_PX = 1;
  var GAP_MAX_TRIES = 6;

  var DRAG_RESIST_PX = 22;
  var DRAG_RELEASE_PX = 80;

  var BOTTOM_TOLERANCE_PX = 1;

  var ids = {
    title: 'comp-mtu6cfia',
    howItWorks: 'comp-mu1mkaan',
    gameSection: 'comp-mn1ezx7p1',
    gameFrame: 'comp-mswdpkzk'
  };

  var docked = false;
  var snapping = false;
  var kbLocked = false;
  var lockedY = 0;
  var lockVisualY = 0;
  var transitionTimer = null;

  var escStartY = null, escDelta = 0, escReleased = false;
  var bottomTouchY = null;

  function mobile() { return matchMedia(MOBILE).matches; }

  function get() {
    return {
      title: document.getElementById(ids.title),
      howItWorks: document.getElementById(ids.howItWorks),
      section: document.getElementById(ids.gameSection),
      game: document.getElementById(ids.gameFrame)
    };
  }

  function layout() {
    var e = get();
    if (!e.title || !e.howItWorks || !e.section || !e.game || !mobile() || kbLocked) return;

    var parent = e.title.parentElement;
    parent.style.setProperty('display', 'block', 'important');

    var wrap = document.querySelector('.dt-howitworks-wrap');
    var placed = wrap && wrap.contains(e.howItWorks) && wrap.previousElementSibling === e.title;
    if (!placed) {
      if (wrap) wrap.remove();
      var w = e.howItWorks.getBoundingClientRect().width;
      wrap = document.createElement('div');
      wrap.className = 'dt-howitworks-wrap';
      e.title.insertAdjacentElement('afterend', wrap);
      wrap.appendChild(e.howItWorks);
      if (w) e.howItWorks.style.width = w + 'px';
    }

    for (var n = e.section.parentElement; n && n !== document.documentElement; n = n.parentElement) {
      var cs = getComputedStyle(n);
      if (cs.overflow !== 'visible') n.style.setProperty('overflow', 'visible', 'important');
      if (cs.transform !== 'none') n.style.setProperty('transform', 'none', 'important');
      if (cs.willChange !== 'auto') n.style.setProperty('will-change', 'auto', 'important');
      if (cs.filter !== 'none') n.style.setProperty('filter', 'none', 'important');
    }

    var titleH = e.title.offsetHeight;
    var vh = (window.visualViewport ? window.visualViewport.height : innerHeight) - titleH;
    e.game.style.top = '0px';
    e.game.style.left = '0px';
    e.game.style.height = vh + 'px';
    e.section.style.top = titleH + 'px';
    e.section.style.height = vh + 'px';
    var frame = e.game.querySelector('iframe');
    if (frame) frame.style.height = '100%';
  }

  function computeDockY(title) {
    return scrollY + title.parentElement.getBoundingClientRect().top;
  }

  function absoluteTop(el) {
    var top = 0;
    while (el) {
      top += el.offsetTop || 0;
      el = el.offsetParent;
    }
    return top;
  }

  function computeStickY(section, titleH) {
    return absoluteTop(section) - titleH;
  }

  function measureGap(e) {
    if (!e.title || !e.section) return 0;
    var t = e.title.getBoundingClientRect();
    var s = e.section.getBoundingClientRect();
    return s.top - t.bottom;
  }

  // The page's true scrollable bottom - where the game section ends.
  // Once scrollY reaches this, there's nothing further down to reveal;
  // any additional downward drag is just iOS's elastic rubber-band.
  function maxScrollY() {
    var vh = window.visualViewport ? window.visualViewport.height : innerHeight;
    return Math.max(0, document.documentElement.scrollHeight - vh);
  }

  function atPageBottom() {
    return scrollY >= maxScrollY() - BOTTOM_TOLERANCE_PX;
  }

  function setDocked(on, title) {
    if (on === docked) return;
    docked = on;
    title.classList.toggle('dt-docked', on);
    title.parentElement.style.paddingTop = on ? title.offsetHeight + 'px' : '';
  }

  function targetStickY(e) {
    if (!docked) setDocked(true, e.title);
    var titleH = e.title.offsetHeight;
    return computeStickY(e.section, titleH);
  }

  function correctGapWhileFrozen(tries) {
    tries = tries || 0;
    var e = get();
    var gap = measureGap(e);
    if (gap > GAP_TOLERANCE_PX && tries < GAP_MAX_TRIES) {
      lockVisualY += gap;
      document.body.style.top = (-lockVisualY) + 'px';
      requestAnimationFrame(function () { requestAnimationFrame(function () { correctGapWhileFrozen(tries + 1); }); });
    }
  }

  function correctGapViaScroll(tries) {
    tries = tries || 0;
    var e = get();
    var gap = measureGap(e);
    if (gap > GAP_TOLERANCE_PX && tries < GAP_MAX_TRIES) {
      scrollBy(0, gap);
      requestAnimationFrame(function () { requestAnimationFrame(function () { correctGapViaScroll(tries + 1); }); });
    }
  }

  function kbLock() {
    if (kbLocked || !mobile()) return;
    var e = get();
    if (!e.title || !e.section) return;

    kbLocked = true;
    lockedY = scrollY;

    var stickY = targetStickY(e);
    lockVisualY = Math.max(scrollY, stickY);

    e.title.style.background = 'rgba(0,0,0,1)';

    document.documentElement.classList.add('dt-kb-lock');
    document.body.classList.add('dt-kb-lock');

    document.body.style.transition = 'none';
    document.body.style.top = (-lockedY) + 'px';
    void document.body.offsetHeight;
    document.body.style.transition = 'top ' + LOCK_SLIDE_MS + 'ms ease';

    requestAnimationFrame(function () {
      document.body.style.top = (-lockVisualY) + 'px';
    });

    clearTimeout(transitionTimer);
    transitionTimer = setTimeout(function () {
      document.body.style.transition = '';
      correctGapWhileFrozen();
    }, LOCK_SLIDE_MS + 50);

    escStartY = null; escDelta = 0; escReleased = false;
  }

  function kbUnlock(targetY) {
    if (!kbLocked) return;
    kbLocked = false;
    clearTimeout(transitionTimer);

    document.body.style.transition = 'none';
    document.documentElement.classList.remove('dt-kb-lock');
    document.body.classList.remove('dt-kb-lock');
    document.body.style.top = '';
    document.body.style.transition = '';

    var e = get();
    if (e.title) e.title.style.background = '';

    var target = typeof targetY === 'number' ? Math.max(0, targetY) : lockVisualY;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        scrollTo(0, target);
        layout();
        sync();
        requestAnimationFrame(function () { requestAnimationFrame(function () { correctGapViaScroll(); }); });
      });
    });
  }

  function requestDock() {
    if (!mobile() || kbLocked) return;
    var e = get();
    if (!e.title || !e.section) return;

    var stickY = targetStickY(e);
    var target = Math.max(scrollY, stickY);
    e.title.style.background = 'rgba(0,0,0,1)';
    scrollTo({ top: target, behavior: 'smooth' });

    var lastY = -1, stableFrames = 0;
    (function poll() {
      if (scrollY === lastY) { stableFrames++; } else { stableFrames = 0; lastY = scrollY; }
      if (stableFrames >= 3) { correctGapViaScroll(); return; }
      requestAnimationFrame(poll);
    })();
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.source !== 'dinotree') return;
    if (d.keyboardOpen === true) { kbLock(); return; }
    if (d.keyboardOpen === false) { kbUnlock(); return; }
    if (d.requestDock) { requestDock(); return; }
  });

  document.addEventListener('touchstart', function (e) {
    if (!kbLocked || !e.touches.length) return;
    escStartY = e.touches[0].clientY;
    escDelta = 0;
    escReleased = false;
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (!kbLocked || escStartY === null || escReleased || !e.touches.length) return;
    escDelta = e.touches[0].clientY - escStartY;

    if (Math.abs(escDelta) >= DRAG_RELEASE_PX) {
      escReleased = true;
      kbUnlock(lockVisualY - escDelta);
      return;
    }

    document.body.style.transition = 'none';
    var damped = Math.sign(escDelta) * DRAG_RESIST_PX *
      (1 - Math.exp(-Math.abs(escDelta) / DRAG_RESIST_PX));
    document.body.style.top = (-lockVisualY + damped) + 'px';
  }, { passive: true });

  document.addEventListener('touchend', function () {
    if (kbLocked && !escReleased) {
      document.body.style.top = (-lockVisualY) + 'px';
    }
    escStartY = null; escDelta = 0;
  }, { passive: true });

  // ── BOTTOM HARD-STOP ─────────────────────────────────────────
  // iOS's elastic drag lets a touch keep dragging the page a bit past its
  // real bottom edge (the game section) before it snaps back - that
  // overshoot is what exposes the background behind the game. Once we're
  // already at the true bottom, a further downward drag has nowhere real
  // to go, so we stop the touch from moving the page instead of letting
  // it stretch and bounce back. Scrolling back up, and all scrolling
  // above the bottom, is untouched. Skipped during the keyboard lock,
  // which freezes scrolling anyway.
  document.addEventListener('touchstart', function (e) {
    if (!mobile() || kbLocked || !e.touches.length) return;
    bottomTouchY = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (!mobile() || kbLocked || bottomTouchY === null || !e.touches.length) return;
    var dy = e.touches[0].clientY - bottomTouchY;
    // Finger moving upward (dy < 0) is what drags the page further down.
    if (dy < 0 && atPageBottom()) {
      e.preventDefault();
    }
  }, { passive: false });

  document.addEventListener('touchend', function () {
    bottomTouchY = null;
  }, { passive: true });

  function sync() {
    var e = get();
    if (!e.title) return;

    if (!mobile()) {
      setDocked(false, e.title);
      if (kbLocked) kbUnlock();
      e.title.style.background = '';
      return;
    }

    if (kbLocked) return;

    var dock = computeDockY(e.title);
    setDocked(scrollY >= dock, e.title);

    var fade = Math.min(1, Math.max(0, (scrollY - dock) / FADE_PX));
    e.title.style.background = 'rgba(0,0,0,' + fade + ')';

    if (!snapping) {
      clearTimeout(sync._t);
      sync._t = setTimeout(function () {
        var d = scrollY - dock;
        if (d > 0 && d < CATCH_PX) {
          snapping = true;
          scrollTo({ top: dock, behavior: 'smooth' });
          setTimeout(function () { snapping = false; }, 300);
        }
      }, TICK_MS);
    }
  }

  addEventListener('scroll', sync, { passive: true });
  addEventListener('resize', function () { layout(); sync(); }, { passive: true });
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', function () { layout(); sync(); }, { passive: true });
  }
  new MutationObserver(function () { layout(); sync(); }).observe(document.body, { childList: true, subtree: true });
  setInterval(function () { layout(); sync(); }, TICK_MS);
  addEventListener('load', function () { layout(); sync(); });
})();
</script>
