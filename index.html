<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#00ff00;font-family:Calibri,"Segoe UI",Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{position:relative;height:100vh;height:100dvh;overflow:hidden}
#header{text-align:center;flex-shrink:0;order:1}
#header h1{font-size:20px;letter-spacing:3px;color:#00ff00}
#header p{font-size:10px;opacity:.5;letter-spacing:1px;margin-top:1px}
#header a{color:#00aa00;text-decoration:none}
/* #topbar floats over #tree-wrap so the tree can use the full height and scroll up behind the buttons. #tree-wrap's padding-top is set in JS (positionTreeWrap) to the topbar's real height. */
#topbar{position:absolute;top:0;left:0;right:0;z-index:25;background:#000;padding:10px 14px 0;display:flex;flex-direction:column;gap:0px}
#input-row{display:flex;flex-direction:row;align-items:stretch;gap:6px;flex-shrink:0}
#input-field-wrap{position:relative;flex:1;min-width:0}
#btn-row{display:flex;gap:6px;flex-shrink:0;position:relative}
#give-up-warn{display:none;position:absolute;top:100%;margin-top:3px;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:bold;color:#ff3333;text-shadow:0 0 4px #000,0 0 4px #000;pointer-events:none;z-index:30}
#give-up-warn.show{display:block}
#guess-input{width:100%;min-width:0;background:#000;color:#00ff00;border:1px solid #00aa00;padding:8px 10px;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:20px;outline:none;height:100%;box-sizing:border-box}
#guess-input:focus{border-color:#00ff00}
#guess-input::placeholder{color:#00701a}
#suggestions{display:none;position:absolute;top:100%;left:0;right:0;margin-top:2px;background:#000;border:1px solid #00aa00;max-height:38vh;overflow-y:auto;z-index:30;-webkit-overflow-scrolling:touch}
#suggestions.show{display:block}
.sugg-item{padding:9px 10px;font-size:15px;color:#00dd00;font-family:Calibri,"Segoe UI",Arial,sans-serif;cursor:pointer;border-bottom:1px solid #002200}
.sugg-item:last-child{border-bottom:none}
.sugg-item:active,.sugg-item.active{background:#001a00;color:#00ff00}
button{background:#000;color:#00ff00;border:1px solid #00aa00;padding:5px 8px;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:10px;cursor:pointer;white-space:nowrap}
button:hover{background:#001a00;border-color:#00ff00}
#btn-row button{padding:0 18px;font-size:14px;letter-spacing:.8px}
#give-up-btn::after{content:'PRACTICE';display:block;height:0;overflow:hidden;visibility:hidden}
#message{font-size:14px;color:#cc3333;flex-shrink:0;min-height:2px;padding-left:2px;order:5}
/* one scroll region: #tree-wrap. the svg is drawn 1:1 and never css-stretched, so box text keeps its size. renderTree shrinks spacing to fit (and text, down to a minimum, on desktop) and whatever still doesn't fit scrolls. */
#tree-wrap{position:absolute;top:0;left:0;right:0;bottom:0;z-index:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 14px 8px}
svg{display:block;margin:0 auto}
#tree-svg rect, #tree-svg text{cursor:pointer}
@media(pointer:fine){
  /* search bar looks too long stretched across a wide monitor */
  #input-row{max-width:700px;margin:0 auto;width:100%}
  #message{max-width:700px;margin:0 auto;width:100%;padding-left:0}
}
@media(pointer:coarse){
  #guess-input{padding:9px 10px;font-size:18px}
  /* two rows: search bar full width, buttons below. three buttons on one row squeezed the input. */
  #input-row{flex-wrap:wrap}
  #input-field-wrap{flex:1 1 100%}
  #btn-row{flex:1 1 100%;margin-top:6px}
  #btn-row button{flex:1 1 auto;padding:8px 10px;font-size:13px;letter-spacing:.5px}
  #btn-row button:nth-child(1){flex-grow:4}
  #btn-row button:nth-child(2){flex-grow:7}
  #btn-row button:nth-child(3){flex-grow:11;padding-left:14px;padding-right:14px}
}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);justify-content:center;align-items:center;z-index:50}
#overlay.show{display:flex}
/* shared look for every pop-up (victory, clade info, high scores): border, background and the close X. each #id rule only adds what's specific to it. */
.popup-box{position:relative;border:1px solid #00ff00;background:#000;box-sizing:border-box}
.popup-close{position:absolute;top:8px;right:10px;font-size:20px;line-height:1;color:#00aa00;cursor:pointer;padding:4px}
.popup-close:hover{color:#00ff00}
#vbox{padding:22px 26px 12px;max-width:480px;width:92%;text-align:center}
#vbox h2{font-size:clamp(24px,9vw,44px);margin-top:-4px;margin-bottom:4px;letter-spacing:1px;padding:0 34px;display:flex;align-items:center;justify-content:center;text-align:center;min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#v-art-wrap{display:none;padding:6px;margin:4px 0;background:radial-gradient(ellipse at center, rgba(0,255,0,.55) 0%, rgba(0,255,0,.28) 40%, rgba(0,255,0,0) 78%)}
#v-art{max-width:100%;max-height:min(520px,52vh);display:block;margin:0 auto;filter:drop-shadow(0 10px 14px rgba(0,0,0,.7))}
#vbox .vsub{font-size:12px;color:#00aa00;margin-bottom:8px;line-height:1.5}
#vbox a.vlink{display:inline-block;margin-top:12px;color:#000;background:#00ff00;border:1px solid #00ff00;padding:8px 26px;font-size:15px;font-weight:bold;text-decoration:none;letter-spacing:1.5px;box-shadow:0 0 14px rgba(0,255,0,.35);line-height:1.25;text-align:center;max-width:100%;box-sizing:border-box}
#vbox a.vlink:hover{background:#66ff66;border-color:#66ff66}
@media(max-width:480px){
  #vbox a.vlink{font-size:14px;padding:7px 20px}
}
/* x and facebook sit in one row. #v-share-pair is display:contents so its children are direct flex items of #v-share-row. flex-wrap is only a fallback for very narrow screens. */
/* negative side margins let the row use the dialog's 32px side padding so the buttons fit on one line on narrow phones */
#v-share-row{margin:16px -14px 0;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
#v-share-pair{display:contents}
.share-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid #00ff00;color:#00ff00;padding:4px 8px;font-size:11px;letter-spacing:.5px;text-decoration:none;cursor:pointer;background:#000;box-sizing:border-box;white-space:nowrap;flex-shrink:0}
.share-btn:hover{background:#001a00}
.share-btn svg{flex-shrink:0}
/* narrow phones: shrink text, padding and icons first so the row fits. the overflow-x above is the last resort. */
@media(max-width:380px){
  .share-btn{font-size:9.5px;padding:4px 6px;gap:3px}
  .share-btn svg{width:11px;height:11px}
}
#clade-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);justify-content:center;align-items:center;z-index:60;padding:20px}
#clade-overlay.show{display:flex}
#clade-box{padding:22px 24px;max-width:420px;width:100%;text-align:left}
#clade-box h2{font-size:16px;letter-spacing:1px;margin-bottom:12px;color:#00ff00;font-style:italic}
#clade-box #clade-text{font-size:13px;color:#00cc00;line-height:1.6;margin-bottom:6px}
#clade-box #clade-text a.dino-link{color:#00ff00;text-decoration:underline}
#clade-box #clade-text a.dino-link:hover{color:#66ff66}
#board-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);justify-content:center;align-items:center;z-index:55;padding:20px}
#board-overlay.show{display:flex}
#board-box{padding:24px 26px;max-width:380px;width:100%;text-align:left}
#board-box h2{font-size:16px;letter-spacing:2px;margin:0 0 14px;color:#00ff00;text-align:center}
#board-entry{display:none;gap:6px;margin-bottom:16px}
#board-initials{flex:1;min-width:0;background:#000;color:#00ff00;border:1px solid #00aa00;padding:8px 10px;font-family:inherit;font-size:16px;outline:none}
#board-initials:focus{border-color:#00ff00}
#board-entry button{white-space:nowrap}
#board-list{font-size:13px;color:#00cc00;line-height:1.9;min-height:20px}
.board-rank{color:#006600;display:inline-block;width:20px}
.board-initials{color:#00ff00;font-weight:bold;letter-spacing:1px;cursor:pointer;text-decoration:underline dotted #006600;text-underline-offset:3px}
.board-initials:hover{text-decoration-color:#00ff00}
.board-detail{display:none;font-size:12px;line-height:1.3;color:#ffd633;margin:-5px 0 12px;padding-left:32px}
.board-detail.show{display:block}
.edge{fill:none;stroke:#003800;stroke-width:3}.edge.epath{stroke:#009900}
.sn{fill:#080808;stroke:#006600;stroke-width:2}.pn{fill:#001a00;stroke:#00cc00;stroke-width:2.5}.bn{fill:#050505;stroke:#006600;stroke-width:1}
.tn{fill:#001400;stroke:#00ff00;stroke-width:1}.wn{fill:#00ff00;stroke:#00ff00;stroke-width:2}.ln{fill:#1a0000;stroke:#aa2200;stroke-width:1.5}
.st{fill:#009900;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-weight:600}.bt{fill:#00aa00;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-style:italic}.wt{fill:#000;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-weight:bold;font-style:italic}
.lt{fill:#aa2200;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-style:italic}.tt{fill:#00ff00;font-family:Calibri,"Segoe UI",Arial,sans-serif;font-weight:bold}.nnew{opacity:0}
#v-sub a{color:#00ff00;text-decoration:underline;cursor:pointer}
#v-sub a:hover{color:#66ff66}
</style>
</head>
<body>
<div id="app">
  <div id="tree-wrap">
    <svg id="tree-svg" preserveAspectRatio="xMidYMin meet"></svg>
  </div>
  <div id="topbar">
    <div id="input-row">
      <div id="input-field-wrap">
        <input type="text" id="guess-input" placeholder="Enter a dinosaur genus..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <div id="suggestions"></div>
      </div>
      <div id="btn-row">
        <button onclick="giveHint()">HINT</button>
        <button id="give-up-btn" onclick="giveUp()">GIVE UP</button>
        <button onclick="showBoard(false)">HIGH SCORES</button>
        <span id="give-up-warn">you'll lose your streak</span>
      </div>
    </div>
    <div id="message"></div>
  </div>
</div>
<div id="overlay">
  <div id="vbox" class="popup-box">
    <span class="popup-close" onclick="document.getElementById('overlay').classList.remove('show')">&times;</span>

    <div class="vsub" id="v-sub"></div>
    <div class="vsub" id="v-streak" style="color:#00ff00"></div>
    <div id="v-art-wrap"><img id="v-art" alt="" /></div>
    <a class="vlink" id="v-link" href="#" target="_blank">LEARN MORE &rarr;</a>
    <div id="v-share-row" style="display:none">
      <div id="v-share-pair">
        <a class="share-btn" href="#" onclick="shareVictory('x'); return false;"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>share on x</a>
        <a class="share-btn" href="#" onclick="shareVictory('facebook'); return false;"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M22 12.06C22 6.505 17.523 2 12 2S2 6.505 2 12.06c0 5.02 3.657 9.184 8.438 9.94v-7.03H7.898v-2.91h2.54V9.845c0-2.507 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562v1.878h2.773l-.443 2.91h-2.33V22c4.78-.756 8.437-4.92 8.437-9.94z"/></svg>facebook</a>
      </div>
    </div>
    <div style="margin-top:8px"><a class="share-btn" id="v-again" href="#" onclick="startPractice(); return false;">practice: play another dino</a></div>
    <div class="vsub next-dino" style="margin:12px 0 -4px;color:#ff3333;font-weight:bold;font-size:14px"></div>
  </div>
</div>
<div id="clade-overlay">
  <div id="clade-box" class="popup-box">
    <span class="popup-close" onclick="hideCladeInfo()">&times;</span>
    <h2 id="clade-title"></h2>
    <div id="clade-text"></div>
  </div>
</div>
<div id="board-overlay">
  <div id="board-box" class="popup-box">
    <span class="popup-close" onclick="hideBoard()">&times;</span>
    <h2>TODAY'S HIGH SCORES</h2>
    <div id="board-entry">
      <input id="board-initials" maxlength="10" placeholder="Name" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="board-submit-btn" onclick="submitScore()">ADD SCORE</button>
    </div>
    <div id="board-already" style="display:none;color:#00cc00;font-size:13px;margin-bottom:12px">You've already added a score today. Come back tomorrow!</div>
    <div id="board-success" style="display:none;color:#00cc00;font-size:13px;margin-bottom:12px">Score added! Come back tomorrow for a new dino.</div>
    <div id="board-error" style="display:none;color:#cc3333;font-size:12px;margin-bottom:12px"></div>
    <div id="board-list"></div>
    <div class="next-dino" style="text-align:center;font-size:14px;color:#ff3333;font-weight:bold;margin:14px 0 -10px"></div>
  </div>
</div>

// clade -> parent, built from the lineages. feeds the auto definitions.
const CLADE_PARENT = {};
const CLADE_CHILDREN = {};
const CLADE_SET = new Set();
for (const t of TAXA) {
  const lin = t.lineage;
  for (let i = 0; i < lin.length - 1; i++) {
    CLADE_SET.add(lin[i]);
    if (i > 0) {
      if (!(lin[i] in CLADE_PARENT)) CLADE_PARENT[lin[i]] = lin[i-1];
      if (!CLADE_CHILDREN[lin[i-1]]) CLADE_CHILDREN[lin[i-1]] = new Set();
      CLADE_CHILDREN[lin[i-1]].add(lin[i]);
    }
  }
}

function exampleGenera(cladeName, count) {
  const out = [];
  for (const t of TAXA) {
    if (out.length >= count) break;
    if (t.lineage.includes(cladeName) && !out.includes(t.name)) out.push(t.name);
  }
  return out;
}

// definition text for a clade, or null if the name is a genus
function cladeDefinition(name) {
  if (CLADE_DEFS[name]) return CLADE_DEFS[name];
  if (!CLADE_SET.has(name)) return null;
  const parent = CLADE_PARENT[name];
  const exOwn = exampleGenera(name, 2);
  if (!parent) return name + ' is the base of the tree shown here, encompassing every dinosaur in this game.';
  const siblingClades = [...(CLADE_CHILDREN[parent] || [])].filter(c => c !== name);
  const sibEx = [];
  for (const sib of siblingClades) {
    const e = exampleGenera(sib, 1)[0];
    if (e && !sibEx.includes(e)) sibEx.push(e);
    if (sibEx.length >= 2) break;
  }
  const against = sibEx.length ? sibEx.join(' and ') : parent;
  let text = name + ' is defined as all members of ' + parent + ' more closely related to ' + (exOwn[0] || name) + ' than to ' + against + '.';
  if (exOwn.length) text += ' Examples include ' + exOwn.join(' and ') + '.';
  return text;
}

function showCladeInfo(name) {
  const def = cladeDefinition(name);
  if (!def) return; // genus, nothing to show
  document.getElementById('clade-title').textContent = name;
  document.getElementById('clade-text').innerHTML = linkifyGenera(def);
  document.getElementById('clade-overlay').classList.add('show');
}

// every genus in a definition links to totaldino.com/dino/<slug>. we can't check whether the page exists
// (Wix sends no CORS headers), so a link can 404 until the page is up.
const ALL_GENUS_NAMES = TAXA.map(t => t.name);
const GENUS_SET = new Set(ALL_GENUS_NAMES);

// most pages use the lowercase genus name as the slug. a few need a longer one, list those here.
const DINO_SLUG_OVERRIDES = { "Zuul": "zuulcrurivastator" };

// builds a totaldino.com/dino/ url. use this everywhere so slug overrides live in one place.
function dinoUrl(name) {
  const slug = DINO_SLUG_OVERRIDES[name] || name.toLowerCase().replace(/ /g, '-');
  return 'https://www.totaldino.com/dino/' + slug;
}

function linkifyGenera(text) {
  const escHtml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const escaped = escHtml(text);
  return escaped.replace(/\b[A-Z][A-Za-z]*\b/g, function(match) {
    if (!GENUS_SET.has(match)) return match;
    return '<a href="' + dinoUrl(match) + '" target="_blank" rel="noopener" class="dino-link">' + match + '</a>';
  });
}

// add nicknames as lowercase letters/digits key: 'Genus'.
const ALIASES = {"trex":"Tyrannosaurus","tyrannosaurusrex":"Tyrannosaurus","tyrannosaur":"Tyrannosaurus","tyranno":"Tyrannosaurus","trike":"Triceratops","raptor":"Velociraptor","stego":"Stegosaurus","ankylo":"Ankylosaurus","diplo":"Diplodocus","brachio":"Brachiosaurus","allo":"Allosaurus","spino":"Spinosaurus","giga":"Giganotosaurus","carno":"Carnotaurus","dilo":"Dilophosaurus","parasaur":"Parasaurolophus","pachy":"Pachycephalosaurus","compy":"Compsognathus","cerato":"Ceratosaurus","deino":"Deinonychus","argentino":"Argentinosaurus","tarbo":"Tarbosaurus","coelo":"Coelophysis","proto":"Protoceratops","apato":"Apatosaurus"};
const normName = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
function editDist(a, b, max) { // edit distance with swaps, bails early once past max
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev2 = null, prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let rowMin = i;
    for (let j = 1; j <= b.length; j++) {
      let v = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
      if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) v = Math.min(v, prev2[j-2] + 1);
      cur[j] = v; if (v < rowMin) rowMin = v;
    }
    if (rowMin > max) return max + 1;
    prev2 = prev; prev = cur;
  }
  return prev[b.length];
}
function fuzzy(q, max) { // closest genera within max typos, best first
  const out = [];
  for (let i = 0; i < ALL_NAMES.length; i++) { const d = editDist(q, ALL_LOWER[i], max); if (d <= max) out.push({ n: ALL_NAMES[i], d }); }
  return out.sort((x, y) => x.d - y.d || x.n.localeCompare(y.n));
}
function nameMatches(query, limit) { // up to limit genus names for the dropdown
  const q = normName(query); if (!q) return [];
  const taken = new Set(S.guesses.map(g => g.name)), out = [];
  const add = n => { if (n && !taken.has(n) && !out.includes(n)) out.push(n); };
  if (ALIASES[q]) add(ALIASES[q]);
  for (let i = 0; i < ALL_NAMES.length && out.length < limit; i++) if (ALL_LOWER[i].startsWith(q)) add(ALL_NAMES[i]);
  if (q.length >= 3) for (const k in ALIASES) if (k.startsWith(q)) add(ALIASES[k]);
  for (let i = 0; i < ALL_NAMES.length && out.length < limit; i++) if (ALL_LOWER[i].includes(q)) add(ALL_NAMES[i]);
  if (out.length < limit && q.length >= 5) fuzzy(q, q.length <= 7 ? 1 : q.length <= 11 ? 2 : 3).forEach(f => add(f.n));
  return out.slice(0, limit);
}
function resolveGuess(raw) { // what Enter submits: exact name, nickname, unique prefix or one clear typo match, else null
  const direct = BY_NAME[raw.trim().toLowerCase()]; if (direct) return direct;
  const q = normName(raw); if (q.length < 2) return null;
  if (ALIASES[q]) return BY_NAME[ALIASES[q].toLowerCase()];
  if (BY_NAME[q]) return BY_NAME[q];
  if (q.length >= 4) {
    const pre = ALL_NAMES.filter((n, i) => ALL_LOWER[i].startsWith(q));
    if (pre.length === 1) return BY_NAME[pre[0].toLowerCase()];
    if (!pre.length && q.length >= 5) { const f = fuzzy(q, q.length <= 7 ? 1 : 2); if (f.length && (f.length === 1 || f[1].d > f[0].d)) return BY_NAME[f[0].n.toLowerCase()]; }
  }
  return null;
}

function playerId() { // random id kept in this browser only, so one person on two devices counts twice
  try {
    let id = localStorage.getItem('dinotree_pid');
    if (!id) { id = Array.from({ length: 16 }, () => Math.floor(Math.random() * 36).toString(36)).join(''); localStorage.setItem('dinotree_pid', id); }
    return id;
  } catch (e) { return null; }
}
// has this browser already been added to today's "people" count?
function countedToday() { try { return localStorage.getItem('dinotree_pday') === todayStr(); } catch (e) { return true; } }
function recordGame() {
  if (S.counted) return; S.counted = true;
  const names = S.guesses.map(g => g.name).concat(S.won ? [S.target.name] : []);
  if (!names.length) return;
  getDb().then(db => {
    const inc = () => firebase.firestore.FieldValue.increment(1), all = {};
    names.forEach(n => { all[n] = inc(); });
    const pid = playerId(); // second small write so stats.html can count players
    const addPerson = pid && !countedToday(); // once per browser per day, for the daily people chart
    if (addPerson) { try { localStorage.setItem('dinotree_pday', todayStr()); } catch (e) {} }
    return Promise.all([
      db.collection('guessStats').doc(todayStr()).set(Object.assign({ games: inc(), first: { [names[0]]: inc() }, all }, addPerson ? { people: inc() } : {}), { merge: true }),
      pid ? db.collection('players').doc(pid).set({ last: todayStr(), games: inc() }, { merge: true }) : null
    ]);
  }).catch(() => {});
}

  suggBox.innerHTML = '';
  suggItems = [];
  highlightedIdx = -1;
}

function updateHighlight() {
  const els = suggBox.querySelectorAll('.sugg-item');
  els.forEach((el, i) => el.classList.toggle('active', i === highlightedIdx));
  if (highlightedIdx >= 0 && els[highlightedIdx]) els[highlightedIdx].scrollIntoView({ block: 'nearest' });
}

function showSuggestions(query) {
  if (!query.trim()) { hideSuggestions(); return; }
  suggItems = nameMatches(query, 3);
  highlightedIdx = -1;
  if (suggItems.length === 0) { hideSuggestions(); return; }
  suggBox.innerHTML = suggItems.map(n => '<div class="sugg-item">' + n + '</div>').join('');
  suggBox.classList.add('show');
}

const escHtml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// Central time so the daily dino and the high scores both roll over at midnight CT for everyone.
// America/Chicago handles CST/CDT by itself.
function todayStr() {
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
  const get = type => parts.find(p => p.type === type).value;
  return get('year') + '-' + get('month') + '-' + get('day');
}

// --- high scores ---
// public daily list. entries are keyed by date so yesterday's board just stops showing, nothing to reset. wins only.
// name filter: a short blocklist checked word by word ("Tony ass" is caught, Bass and Class pass).
// BLOCK_WORDS has to match a whole word, BLOCK_SUBSTR matches inside any word. edit freely.
const BLOCK_WORDS = new Set(['ASS','FAG','FUK','FUC','CUM','SEX','GAY','NIG','KKK','RAP','TIT','DIK','COK','SHT','PIS','CNT','ARSE','TITS','DICK','COCK','PENIS','VAGINA','ANUS','PORN','RAPE','NAZI']);
const BLOCK_SUBSTR = ['FUCK','SHIT','CUNT','NIGG','FAGG','BITCH','PUSSY','SLUT','WHORE','ASSHOLE'];
const LEET = { '@': 'A', '4': 'A', '$': 'S', '5': 'S', '0': 'O', '1': 'I', '!': 'I', '3': 'E' }; // a$$ -> ass
function isBlockedInitials(name) {
  const words = name.toUpperCase().replace(/[@4$50!13]/g, c => LEET[c]).split(/[^A-Z]+/).filter(Boolean);
  return words.some(w => BLOCK_WORDS.has(w) || BLOCK_SUBSTR.some(b => w.includes(b))) || BLOCK_WORDS.has(words.join('')); // last check catches "A S S"
}

function alreadySubmittedToday() {
  try { return localStorage.getItem('dinotree_submitted') === todayStr(); }
  catch (err) { return false; } // e.g. private browsing blocks storage
}
function markSubmittedToday() {
  try { localStorage.setItem('dinotree_submitted', todayStr()); } catch (err) {}
}

function showBoard(withEntry) {
  tickNext();
  notifyDinotreeDock();
  const already = withEntry && alreadySubmittedToday();
  document.getElementById('board-entry').style.display = (withEntry && !already) ? 'flex' : 'none';
  document.getElementById('board-already').style.display = already ? 'block' : 'none';
  // reset the messages and button state each time the board opens
  document.getElementById('board-success').style.display = 'none';
  document.getElementById('board-error').style.display = 'none';
  const submitBtn = document.getElementById('board-submit-btn');
  const initialsEl = document.getElementById('board-initials');
  submitBtn.disabled = false;
  initialsEl.disabled = false;
  document.getElementById('board-overlay').classList.add('show');
  loadHighScores();
  if (withEntry && !already) initialsEl.focus();
}
function hideBoard() {
  document.getElementById('board-overlay').classList.remove('show');
}

async function submitScore() {
  const btn = document.getElementById('board-submit-btn');
  const el = document.getElementById('board-initials');
  const errEl = document.getElementById('board-error');
  // stop double entries: refuse if today's score already went in, and disable the button before the await
  // so a fast double click can't submit twice (a disabled button doesn't fire click events).
  if (btn.disabled) return;
  if (alreadySubmittedToday()) {
    document.getElementById('board-entry').style.display = 'none';
    document.getElementById('board-already').style.display = 'block';
    return;
  }
  errEl.style.display = 'none';
  const initials = el.value.trim().slice(0, 10);
  if (!initials) return;
  if (isBlockedInitials(initials)) { errEl.textContent = "That name isn't allowed - please try another."; errEl.style.display = 'block'; return; }
  btn.disabled = true;
  el.disabled = true;
  try {
    const db = await getDb(), st = loadStats();
    await db.collection('scores').add({
      date: todayStr(),
      initials: initials,
      guesses: guessCount(),
      hints: S.hints,
      score: guessCount() + S.hints,
      streak: st.streak,
      ts: firebase.firestore.FieldValue.serverTimestamp()
    });
    markSubmittedToday();
    document.getElementById('board-entry').style.display = 'none';
    // shown right after a successful submit. not the same as #board-already, which is the gate when reopening the dialog.
    document.getElementById('board-success').style.display = 'block';
    loadHighScores();
  } catch (err) {
    btn.disabled = false;
    el.disabled = false;
    console.error('High scores submit failed:', err);
    // show the failure. a permission-denied from the Firestore rules is the usual cause and otherwise looks like nothing happened.
    errEl.textContent = (err && err.code === 'permission-denied')
      ? "Couldn't save your score - the high scores database rules are blocking writes."
      : "Couldn't save your score. Please try again.";
    errEl.style.display = 'block';
  }
}

const scoreOf = r => Number.isFinite(r.score) ? r.score : (Number(r.guesses) || 0) + (Number(r.hints) || 0);
// top 10 only, sorted by the server. needs a composite index (date, score, hints). until it exists
// the console prints a create link and we fall back to reading everything.
async function fetchTodayScores() {
  const db = await getDb();
  const base = db.collection('scores').where('date', '==', todayStr());
  try {
    return (await base.orderBy('score').orderBy('hints').limit(10).get()).docs.map(d => d.data());
  } catch (err) {
    if (!err || err.code !== 'failed-precondition') throw err;
    console.warn('Dinotree: create the Firestore index (date, score, hints); using the slow fallback meanwhile.', err);
    return (await base.get()).docs.map(d => d.data());
  }
}
async function loadHighScores() {
  const listEl = document.getElementById('board-list');
  listEl.textContent = 'Loading...';
  try {
    const rows = (await fetchTodayScores()).sort((a, b) => (scoreOf(a) - scoreOf(b)) || ((a.hints | 0) - (b.hints | 0)));
    if (rows.length === 0) { listEl.textContent = 'Nobody yet today - Be the first!'; return; }
    listEl.innerHTML = rows.slice(0, 10).map((r, i) => {
      const sk = Number(r.streak) | 0; // older entries have none
      const detail = sk > 0 ? 'Current streak: ' + sk + (sk === 1 ? ' day' : ' days') : 'No streak recorded';
      return '<div class="board-row"><span class="board-rank">' + (i+1) + '.</span> ' +
        '<span class="board-initials" title="Tap to see their streak">' + escHtml(String(r.initials).slice(0, 10)) + '</span> - ' +
        formatGuessHintPhrase(Number(r.guesses) | 0, Number(r.hints) | 0) + '</div><div class="board-detail">' + detail + '</div>';
    }).join('');
    listEl.onclick = e => { // tap a name to toggle that player's streak
      const n = e.target.closest('.board-initials'), d = n && n.parentNode.nextElementSibling;
      if (!d || !d.classList.contains('board-detail')) return;
      const wasOpen = d.classList.contains('show');
      listEl.querySelectorAll('.board-detail.show').forEach(x => x.classList.remove('show')); // close whichever one was open
      if (!wasOpen) d.classList.add('show');
    };
  } catch (err) {
    listEl.textContent = 'Could not load the high scores.';
    console.error('High scores load failed:', err);
  }
}

  const topbarEl = document.getElementById('topbar');

  // desktop's topbar is one short row, so it needs a bigger gap than the two-row mobile one to match.

// tells the parent page (the Wix iframe host) when the search box gains or loses focus, so it can hold its scroll
// while the keyboard opens. does nothing if this file is opened outside the iframe.
function notifyDinotreeKeyboard(open) {
  try {
    window.parent.postMessage({ source: 'dinotree', keyboardOpen: open }, '*');
  } catch (e) {}
}

// tells the parent to dock the game under the title for things that change the screen without the keyboard
// (a hint, opening the high scores). does nothing outside the Wix iframe.
function notifyDinotreeDock() {
  try {
    window.parent.postMessage({ source: 'dinotree', requestDock: true }, '*');
  } catch (e) {}
}

// forwards touch drags to the parent so it can add resistance when the docked game is swiped down.
// the parent decides (dockArm). until it says so, or says dockRelease, native scrolling is left alone, which keeps the momentum.
let dockTouchStartY = null;
let dockArmedByHost = false;
function notifyDinotreeDockTouch(phase, y) {
  try {
    window.parent.postMessage({ source: 'dinotree', dockTouch: { phase: phase, y: y } }, '*');
  } catch (e) {}
}
window.addEventListener('message', function (e) {
  const d = e.data;
  if (e.source !== window.parent || !d || !d.dtHost) return;
  if (typeof d.dockArm === 'boolean') dockArmedByHost = d.dockArm;
  if (d.dockRelease) dockArmedByHost = false;
});
document.addEventListener('touchstart', function (e) {
  if (!e.touches.length) return;
  dockTouchStartY = e.touches[0].clientY;
  dockArmedByHost = false; // reset until the parent replies
  notifyDinotreeDockTouch('start', dockTouchStartY);
}, { passive: true });
document.addEventListener('touchmove', function (e) {
  if (dockTouchStartY === null || !e.touches.length) return;
  const y = e.touches[0].clientY;
  if (dockArmedByHost) {
    if (y - dockTouchStartY > 8) e.preventDefault();
    notifyDinotreeDockTouch('move', y);
  }
}, { passive: false });
document.addEventListener('touchend', function () {
  dockTouchStartY = null;
  notifyDinotreeDockTouch('end', 0);
}, { passive: true });
document.addEventListener('touchcancel', function () {
  dockTouchStartY = null;
  notifyDinotreeDockTouch('end', 0);
}, { passive: true });

// --- daily schedule ---
// first 7 days (Oct 1-7, 2026) are a fixed list. after that it runs rounds: every dino in the pool once, shuffled,
// then a new shuffle. nothing repeats within ~2 weeks, even across rounds. new dinos join automatically
// (adding one mid-round reshuffles the rest of that round once).
const SCHEDULE_START = '2026-10-01';
const DAILY_SCHEDULE = ["Stegoceras","Triceratops","Hypsilophodon","Protoceratops","Deinonychus","Stegosaurus","Brontosaurus"];
function dayNumber(dateStr) {
  const a = dateStr.split('-').map(Number), b = SCHEDULE_START.split('-').map(Number);
  return Math.round((Date.UTC(a[0], a[1]-1, a[2]) - Date.UTC(b[0], b[1]-1, b[2])) / 864e5);
}
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function strSeed(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
const roundCache = {};
function roundOrder(c, names) { // round c: whole pool shuffled, last 14 of the previous round kept out of the first 14
  const key = c + ':' + names.length; if (roundCache[key]) return roundCache[key];
  const prevTail = new Set((c === 0 ? DAILY_SCHEDULE : roundOrder(c - 1, names)).slice(-14));
  const rnd = mulberry32(strSeed('dinotree-round-' + c)), order = names.slice();
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  for (let i = 0, j = 14; i < Math.min(14, order.length); i++) if (prevTail.has(order[i])) { // swap recent dinos out of the first 14 days
    while (j < order.length && prevTail.has(order[j])) j++;
    if (j >= order.length) break; [order[i], order[j]] = [order[j], order[i]]; j++;
  }
  return roundCache[key] = order;
}
function pickTarget(dateStr) {
  const n = Math.max(0, dayNumber(dateStr));
  if (n < DAILY_SCHEDULE.length) return BY_NAME[DAILY_SCHEDULE[n].toLowerCase()];
  const names = targetPool().map(t => t.name).sort(), m = n - DAILY_SCHEDULE.length;
  return BY_NAME[roundOrder(Math.floor(m / names.length), names)[m % names.length].toLowerCase()];
}

// --- saved progress ---
function saveProgress() {
  if (S.practice) return;
  try { localStorage.setItem('dinotree_state', JSON.stringify({ date: todayStr(), target: S.target.name, guesses: S.guesses.map(g => g.name), hints: S.hints, hintNodes: [...S.hintNodes], revealed: S.revealed, won: S.won, over: S.over })); } catch (e) {}
}
function restoreProgress() {
  try {
    const d = JSON.parse(localStorage.getItem('dinotree_state') || 'null');
    if (!d || d.date !== todayStr() || d.target !== S.target.name) return false;
    if (d.won || d.over) return 'done';
    for (const name of d.guesses) {
      const t = name === 'Aves' ? AVES_TAXON : BY_NAME[String(name).toLowerCase()];
      if (t) S.guesses.push({ name: t.name, lineage: t.lineage, lcaIdx: findLCA(t.lineage, S.target.lineage) });
    }
    S.hints = d.hints | 0; S.hintNodes = new Set(d.hintNodes || []); S.revealed = d.revealed | 0;
    return 'active';
  } catch (e) { return false; }
}

const targetPool = () => TARGET_POOL.filter(n => TOTALDINO_PAGES.has(n)).map(n => BY_NAME[n.toLowerCase()]).filter(Boolean);
function addDays(ds, n) { const a = ds.split('-').map(Number); return new Date(Date.UTC(a[0], a[1]-1, a[2]+n)).toISOString().slice(0, 10); }

// --- streaks ---
function loadStats() {
  try { return Object.assign({ streak: 0, best: 0, last: '' }, JSON.parse(localStorage.getItem('dinotree_stats') || '{}')); }
  catch (e) { return { streak: 0, best: 0, last: '' }; }
}
function recordResult(won) {
  if (S.practice) return;
  const st = loadStats(), today = todayStr();
  if (won) { if (st.last !== today) st.streak = (st.last === addDays(today, -1)) ? st.streak + 1 : 1; st.last = today; st.best = Math.max(st.best, st.streak); }
  else st.streak = 0;
  try { localStorage.setItem('dinotree_stats', JSON.stringify(st)); } catch (e) {}
}

// --- countdown to midnight Central ---
function tickNext() {
  if (document.hidden) return;
  let txt = 'A new dino is ready - reload to play!';
  if (todayStr() === S.day) {
    const p = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Chicago', hourCycle: 'h23', hour: 'numeric', minute: 'numeric', second: 'numeric' }).formatToParts(new Date());
    const g = t => +p.find(x => x.type === t).value, s = 86400 - (g('hour') * 3600 + g('minute') * 60 + g('second')), z = n => String(n).padStart(2, '0');
    txt = 'Next daily dino in ' + z(s / 3600 | 0) + ':' + z(s % 3600 / 60 | 0) + ':' + z(s % 60);
  }
  document.querySelectorAll('.next-dino').forEach(el => { el.textContent = txt; });
}

// --- practice mode: random dino, nothing saved ---
function startPractice() {
  const pool = targetPool().filter(t => t.name !== S.target.name && t.name !== S.dailyName);
  S.target = pool[Math.random() * pool.length | 0];
  Object.assign(S, { guesses: [], revealed: 0, hints: 0, won: false, over: false, hintNodes: new Set(), practice: true, artWarm: false, counted: false });
  drawnNodes = null; prevPositions = null; prevVW = prevVH = null;
  clearTimeout(giveUpTimer); giveUpTimer = null; giveUpWarn(false);
  ['overlay', 'clade-overlay', 'board-overlay'].forEach(id => document.getElementById(id).classList.remove('show'));
  setMsg(''); renderTree(); updateStatus();
  document.getElementById('tree-wrap').scrollTop = 0;
}

function init() {
  positionTreeWrap();
  if (window.ResizeObserver) {
    new ResizeObserver(positionTreeWrap).observe(document.getElementById('topbar'));
  } else {
    window.addEventListener('resize', positionTreeWrap);
  }
  const today = todayStr();
  // answers come from TARGET_POOL (well-known genera) limited to ones with a page, so the daily always links back to the site.
  S.target = pickTarget(today); S.dailyName = S.target.name; S.day = today;
  // unfinished daily: resume. finished daily: go straight to practice.
  if (restoreProgress() === 'done') startPractice(); else { renderTree(); updateStatus(); }
  tickNext(); setInterval(tickNext, 1000);
  const inputEl = document.getElementById('guess-input');
  if (window.matchMedia('(pointer: coarse)').matches) inputEl.placeholder = 'Enter a dinosaur...'; // shorter on mobile so it isn't clipped by the narrow search bar

  // iOS scrolls the TOP page to show a focused input inside an iframe, before any JS can react, and preventScroll
  // doesn't stop that across the frame boundary. what we can control is timing: tell the parent on touchstart
  // (not touchend) so it has the whole press to freeze its scroll.
  if (window.matchMedia('(pointer: coarse)').matches) {
    let inputTapStartY = null;
    inputEl.addEventListener('touchstart', function (e) {
      if (!e.touches.length) return;
      inputTapStartY = e.touches[0].clientY;
      notifyDinotreeKeyboard(true);
    }, { passive: true });
    inputEl.addEventListener('touchmove', function (e) {
      if (inputTapStartY === null || !e.touches.length) return;
      if (Math.abs(e.touches[0].clientY - inputTapStartY) > 10) {
        // it was a drag, not a tap
        inputTapStartY = null;
        notifyDinotreeKeyboard(false);
      }
    }, { passive: true });
    inputEl.addEventListener('touchend', function (e) {
      e.preventDefault();
      if (inputTapStartY === null) return; // cancelled above
      inputTapStartY = null;
      inputEl.focus({ preventScroll: true });
    }, { passive: false });
    inputEl.addEventListener('touchcancel', function () {
      if (inputTapStartY !== null) { inputTapStartY = null; notifyDinotreeKeyboard(false); }
    });
  }
  function submitNow() {
    const mobile = window.matchMedia('(pointer: coarse)').matches;
    // tried toggling readonly to hide/reopen the keyboard around the animation, but browsers differ and reopening
    // needs a fresh tap anyway. so on mobile we just blur and leave it closed.
    if (mobile) inputEl.blur();
    submitGuess();
    if (!mobile) inputEl.focus(); // desktop: ready for the next guess right away
  }
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && suggItems.length > 0) {
      e.preventDefault();
      highlightedIdx = Math.min(highlightedIdx + 1, suggItems.length - 1);
      updateHighlight();
    } else if (e.key === 'ArrowUp' && suggItems.length > 0) {
      e.preventDefault();
      highlightedIdx = Math.max(highlightedIdx - 1, -1);
      updateHighlight();
    } else if (e.key === 'Enter') {
      if (highlightedIdx >= 0 && suggItems[highlightedIdx]) inputEl.value = suggItems[highlightedIdx];
      hideSuggestions();
      submitNow();
    }
  });
  inputEl.addEventListener('input', () => showSuggestions(inputEl.value));
  inputEl.addEventListener('blur', () => { setTimeout(hideSuggestions, 150); notifyDinotreeKeyboard(false); }); // delay so a tap on a suggestion still registers
  suggBox.addEventListener('mousedown', e => e.preventDefault()); // keep the keyboard open through the tap
  suggBox.addEventListener('click', e => {
    const item = e.target.closest('.sugg-item');
    if (!item) return;
    inputEl.value = item.textContent;
    hideSuggestions();
    if (window.matchMedia('(pointer: coarse)').matches) submitNow(); // mobile: tapping a suggestion submits it
    else inputEl.focus(); // desktop: just fill it in, like arrow keys then Enter
  });
  document.getElementById('overlay').addEventListener('click', function(e){ if(e.target===this) this.classList.remove('show'); });
  document.getElementById('clade-overlay').addEventListener('click', function(e){ if(e.target===this) hideCladeInfo(); });
  // one click handler on the svg, since its innerHTML is replaced on every render
  document.getElementById('tree-svg').addEventListener('click', function(e){
    const key = e.target.getAttribute && e.target.getAttribute('data-key');
    if (key) showCladeInfo(key);
  });
}

// --- LCA ---
function findLCA(a, b) {
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  return i - 1;
}

// --- actions ---
function submitGuess() {
  if (S.won || S.over) return;
  const inp = document.getElementById('guess-input');
  const raw = inp.value.trim(); inp.value = '';
  if (!raw) return;
  const taxon = resolveGuess(raw);
  if (!taxon) { setMsg('Oops! The entered dinosaur name is invalid. Perhaps you entered a pterosaur, or made a ptypo?'); logMissed(raw); return; }
  if (S.guesses.find(g => g.name === taxon.name)) { setMsg(taxon.name + ' already guessed.'); return; }
  setMsg('');
  if (taxon.name === S.target.name) {
    S.won = true; S.revealed = S.target.lineage.length - 1;
    saveProgress(); recordResult(true); recordGame(); renderTree(); updateStatus(); setTimeout(showVictory, 500); return;
  }
  const lca = findLCA(taxon.lineage, S.target.lineage);
  if (lca > S.revealed) S.revealed = lca;
  S.guesses.push({name: taxon.name, lineage: taxon.lineage, lcaIdx: lca});
  saveProgress();
  if (!S.artWarm) { S.artWarm = true; prepareArt(S.target.name); } // start fetching the victory art while they play
  renderTree(); updateStatus();
}

function giveHint() {
  if (S.won || S.over || S.revealed >= S.target.lineage.length - 2) return;
  notifyDinotreeDock();
  S.revealed++;
  S.hints++;
  // reveal only this node, not the whole path
  S.hintNodes.add(S.target.lineage[S.revealed]);
  saveProgress();
  renderTree(); updateStatus();
}

let giveUpTimer = null;
function giveUpWarn(on) { // "you'll lose your streak" warning, daily game only
  const w = document.getElementById('give-up-warn'), b = document.getElementById('give-up-btn');
  if (on && !S.practice) { w.style.left = (b.offsetLeft + b.offsetWidth / 2) + 'px'; w.classList.add('show'); } else w.classList.remove('show');
}
function giveUp() {
  if (S.won || S.over) { startPractice(); return; } // after finishing this button becomes PRACTICE
  const btn = document.getElementById('give-up-btn');
  if (!giveUpTimer) { btn.textContent = 'SURE?'; giveUpWarn(true); giveUpTimer = setTimeout(() => { giveUpTimer = null; btn.textContent = 'GIVE UP'; giveUpWarn(false); }, 3000); return; }
  clearTimeout(giveUpTimer); giveUpTimer = null; btn.textContent = 'GIVE UP'; giveUpWarn(false);
  S.over = true; S.revealed = S.target.lineage.length - 1; saveProgress(); recordResult(false); recordGame();
  renderTree(); updateStatus(); setMsg('The answer was: ' + S.target.name);
  setTimeout(showVictory, 500);
}

function setMsg(t) { document.getElementById('message').textContent = t; }

function updateStatus() {
  const gb = document.getElementById('give-up-btn');
  if (S.won || S.over) gb.textContent = 'PRACTICE'; else if (!giveUpTimer) gb.textContent = 'GIVE UP';
}

// --- unified tree ---
// one tree from every guess lineage plus the revealed target path.
// a node shows only if it has 2+ leaves under it, or it's the root or a leaf.

function buildUnifiedTree() {
  const nmap = new Map(); // name -> node

  function getN(name) {
    if (!nmap.has(name)) nmap.set(name, {name, ch: new Map(), isLeaf:false, isTarget:false, depth:-1, leafCount:0});
    return nmap.get(name);
  }

  function addLineage(lineage, leafIsTarget) {
    for (let i = 0; i < lineage.length; i++) {
      const node = getN(lineage[i]);
      if (i > 0) {
        const par = getN(lineage[i-1]);
        if (!par.ch.has(lineage[i])) par.ch.set(lineage[i], node);
      }
    }
    const last = getN(lineage[lineage.length-1]);
    last.isLeaf = true;
    if (leafIsTarget) last.isTarget = true;
  }

  // target path, ending in the special marker
  const targetEnd = '???';
  const targetPath = [...S.target.lineage.slice(0, S.revealed + 1), targetEnd];
  addLineage(targetPath, true);

  // all wrong guesses
  for (const g of S.guesses) addLineage(g.lineage, false);

  // assign depths
  function setDepth(name, d) {
    const node = getN(name);
    if (node.depth === -1) node.depth = d;
    for (const [,c] of node.ch) setDepth(c.name, d+1);
  }
  setDepth('Dinosauria', 0);

  // count leaves per subtree
  function cLeaves(node) {
    if (node.leafCount > 0) return node.leafCount;
    if (node.isLeaf || node.ch.size === 0) { node.leafCount = 1; return 1; }
    let total = 0;
    for (const [,c] of node.ch) total += cLeaves(c);
    node.leafCount = total;
    return total;
  }
  cLeaves(getN('Dinosauria'));

  return getN('Dinosauria');
}

// keep only branch points and leaves (skip single-leaf segments)
function buildVisible(rawRoot) {
  function hasTarget(vnode) {
    if (vnode.isTarget) return true;
    return vnode.children.some(c => hasTarget(c));
  }

  function isVis(rnode) {
    return rnode.name === 'Dinosauria' || rnode.isLeaf || rnode.ch.size >= 2 || S.hintNodes.has(rnode.name);
  }

  function findNext(rnode) {
    if (isVis(rnode)) return build(rnode);
    // pass through single-child hidden nodes
    const results = [];
    for (const [,c] of rnode.ch) { const r = findNext(c); if(r) results.push(r); }
    return results.length === 0 ? null : results[0];
  }

  function build(rnode) {
    const vn = {name: rnode.name, children: [], isLeaf: rnode.isLeaf, isTarget: rnode.isTarget, origDepth: rnode.depth};
    for (const [,c] of rnode.ch) {
      const vc = findNext(c);
      if (vc) vn.children.push(vc);
    }
    // target path goes last (rightmost)
    vn.children.sort((a,b) => {
      const at = hasTarget(a), bt = hasTarget(b);
      return at === bt ? 0 : (at ? 1 : -1);
    });
    return vn;
  }

  return build(rawRoot);
}

// --- layout ---
// collision-aware: each node's x is found by checking real rectangles (and connector lines) against what's
// already placed, shifting right only as far as needed. that's what keeps lines from crossing. subtrees that
// don't interfere get a shift of zero, so branches tuck into unused space on their own.

function packCluster(wl, maxCols) {
  const n = wl.length;
  const naturalCols = n <= 2 ? n : (n <= 6 ? 2 : 3);
  const cols = Math.max(1, Math.min(maxCols, naturalCols));
  wl.forEach((g, i) => {
    g.col = i % cols;
    g.row = Math.floor(i / cols);
    // small alternating row nudge inside this cluster's columns, for a rounder shape
    g.stagger = (cols > 1 && g.row % 2 === 1) ? 0.18 : 0;
  });
  return cols;
}

// smallest rightward shift that gets every rect in `moving` clear of every rect in `fixed` (with `gap`)
function requiredShift(fixed, moving, gap) {
  let shift = 0;
  for (const f of fixed) {
    for (const m of moving) {
      if (f.y0 < m.y1 && m.y0 < f.y1) { // vertical ranges overlap
        const need = (f.x1 - m.x0) + gap;
        if (need > shift) shift = need;
      }
    }
  }
  return shift;
}

function layoutTree(root, LH, NH, SGAP, maxCols, nw, labelOf, gap) {
  const STACK_GAP = LH * 0.35; // space between stacked sibling branches

  // lays out a node's subtree in its own frame (about centered on x=0). returns { rects, relX }, where rects
  // covers everything in the subtree at its final relative position.
  function layout(node, y) {
    node.absY = y;
    if (node.children.length === 0) {
      const w = nw(labelOf(node));
      node.lx = 0;
      return { rects: [{ x0: -w/2, x1: w/2, y0: y, y1: y + NH + SGAP }], relX: 0 };
    }

    const wl = node.children.filter(c => c.isLeaf && !c.isTarget);
    const ot = node.children.filter(c => !c.isLeaf || c.isTarget);
    const cy = y + LH;
    let rects = [];
    let childXs = [];

    if (wl.length > 0) {
      const cols = packCluster(wl, maxCols);
      const widest = Math.max(...wl.map(g => nw(labelOf(g))));
      const pitch = widest + gap;
      wl.forEach(g => {
        const w = nw(labelOf(g));
        const gx = (g.col - (cols - 1) / 2 + g.stagger) * pitch;
        const gy = cy + g.row * (NH + SGAP);
        g.lx = gx; g.absY = gy;
        rects.push({ x0: gx - w/2, x1: gx + w/2, y0: gy, y1: gy + NH + SGAP });
        childXs.push(gx);
      });
    }

    let cursorY = cy;
    ot.forEach((o, i) => {
      const startY = (i === 0) ? cy : cursorY;
      const sub = layout(o, startY);
      let shift = requiredShift(rects, sub.rects, gap);
      if (i > 0) {
        // also keep the connector's vertical corridor (from where this stack starts down to its deepest point) clear
        // of everything already drawn, so a deep branch's line can't cut through an earlier branch's boxes.
        const halfW = nw(labelOf(o)) / 2;
        const deepest = sub.rects.length ? Math.max(...sub.rects.map(r => r.y1)) : startY + NH + SGAP;
        const corridor = [{ x0: sub.relX - halfW, x1: sub.relX + halfW, y0: cy, y1: deepest }];
        shift = Math.max(shift, requiredShift(rects, corridor, gap));
      }
      if (shift !== 0) shiftSubtree(o, shift);
      const shiftedRects = sub.rects.map(r => ({ x0: r.x0 + shift, x1: r.x1 + shift, y0: r.y0, y1: r.y1 }));
      rects = rects.concat(shiftedRects);
      childXs.push(o.lx);
      const deepestY = shiftedRects.length ? Math.max(...shiftedRects.map(r => r.y1)) : startY + NH + SGAP;
      cursorY = deepestY + STACK_GAP;
    });

    const relX = childXs.length ? childXs.reduce((a,b)=>a+b,0) / childXs.length : 0;
    node.lx = relX;
    const w = nw(labelOf(node));
    rects.push({ x0: relX - w/2, x1: relX + w/2, y0: y, y1: y + NH + SGAP });
    return { rects, relX };
  }

  // add shift to node.lx and every descendant (they were set in the nested call, in the frame that's moving)
  function shiftSubtree(node, shift) {
    node.lx += shift;
    node.children.forEach(c => shiftSubtree(c, shift));
  }

  const result = layout(root, 6);
  let minX = Infinity, maxX = -Infinity, maxY = 0;
  result.rects.forEach(r => {
    minX = Math.min(minX, r.x0);
    maxX = Math.max(maxX, r.x1);
    maxY = Math.max(maxY, r.y1);
  });
  return { minX, maxX, maxY };
}
// --- render ---
function renderTree() {
  if (activeTweenFinish) { activeTweenFinish(); activeTweenFinish = null; }
  const myGen = ++renderGen;
  const rawRoot = buildUnifiedTree();
  const visRoot = buildVisible(rawRoot);
  const isMobile = window.matchMedia('(pointer: coarse)').matches;
  const BASE_NH       = 40;
  const BASE_LH       = isMobile ? 88  : 100;
  const BASE_SGAP     = 8;
  const BASE_FONT     = 16;
  const BASE_GAP      = isMobile ? 14  : 20;   // base gap between neighbouring boxes/branches
  const GUTTER        = isMobile ? 10  : 14;   // side padding past the outermost box
  const MAX_CLUSTER_COLS = 3;

  // compression floors. phase 1 (s 0..1) shrinks gaps twice as fast as boxes, down to a comfortable box floor
  // (BSCALE_MID). if it still doesn't fit, phase 2 (s 1..2) shrinks boxes too, down to BSCALE_FLOOR, so the tree
  // can't overflow the width.
  const GSCALE_FLOOR = 0.06;
  const BSCALE_MID   = 0.55;
  const BSCALE_FLOOR = 0.22;

  // t = box tightness (0..1): trims padding and min width (and box height in the fit below), font size untouched
  function nwAt(lbl, scale, t) { t = t || 0; return Math.max(70 - 22 * t, lbl.length * 9.5 + 26 - 14 * t) * scale; }
  function labelOf(n) { return (n.isTarget && (S.won || S.over)) ? S.target.name : n.name; }

  function paramsFromS(s) {
    if (s <= 1) return { gScale: 1 - s * (1 - GSCALE_FLOOR), bScale: 1 - s * (1 - BSCALE_MID) / 2 };
    const s2 = Math.min(s - 1, 1);
    return { gScale: GSCALE_FLOOR, bScale: BSCALE_MID - s2 * (BSCALE_MID - BSCALE_FLOOR) };
  }

  const treeWrapEl = document.getElementById('tree-wrap');
  // clientWidth includes tree-wrap's 28px of side padding, subtract it
  const availW = (treeWrapEl.clientWidth ? treeWrapEl.clientWidth - 28 : 0) || (isMobile ? 340 : 800);

  // --- fitting ---
  // metricsAt() runs the real layout at a trial setting and measures it.
  //   s = gap/box compression (0..2), solved against the width
  //   v = level spacing squash (VMIN..1), flatter tree, text stays full size
  //   k = extra shrink of boxes and text (down to MINFONT), only if squashing can't fit the height
  // the desktop iframe is height limited (5:4) so it has to fit vertically too. phones scroll (availH = Infinity),
  // which leaves k = v = 1 and the old behaviour.
  const VMIN = 0.6, VTIGHT = 0.45, MINFONT = 8, MINLINE = 14; // desktop: always leave at least 14px of connector line between levels
  const vFloor = p => VMIN - (VMIN - VTIGHT) * p; // tighter boxes can sit closer and still leave room for the connectors
  const hAvail = treeWrapEl.clientHeight - (parseFloat(treeWrapEl.style.paddingTop) || 0) - 8;
  const availH = (isMobile || hAvail < 120) ? Infinity : hAvail;
  function metricsAt(s, k, v, t) {
    const p = paramsFromS(s), bS = p.bScale * k;
    const nhS = BASE_NH * bS * (1 - 0.3 * t);
    const r = layoutTree(visRoot, Math.max(BASE_LH * bS * v, isMobile ? 0 : nhS + MINLINE), nhS, BASE_SGAP * bS, MAX_CLUSTER_COLS, lbl => nwAt(lbl, bS, t), labelOf, Math.max(4, BASE_GAP * p.gScale));
    return { w: (r.maxX - r.minX) + GUTTER * 2, h: r.maxY + 20 };
  }
  function solveS(k, t) { // smallest compression whose width fits (2 = best effort)
    if (metricsAt(0, k, 1, t).w <= availW) return 0;
    if (metricsAt(2, k, 1, t).w > availW) return 2;
    let lo = 0, hi = 2;
    for (let i = 0; i < 12; i++) { const mid = (lo + hi) / 2; if (metricsAt(mid, k, 1, t).w <= availW) hi = mid; else lo = mid; }
    return hi;
  }
  const hAt = (t, v, k) => metricsAt(solveS(k, t), k, v, t).h;
  // order on desktop: tighten boxes, squash levels, shrink gaps, shrink text. phones skip this (availH = Infinity)
  // and keep the width-only behaviour.
  let t = 0, k = 1, v = 1;
  if (!isMobile && metricsAt(0, 1, 1, 0).w > availW) {
    if (metricsAt(0, 1, 1, 1).w > availW) t = 1;
    else { let lo = 0, hi = 1; for (let i = 0; i < 8; i++) { const mid = (lo + hi) / 2; if (metricsAt(0, 1, 1, mid).w <= availW) hi = mid; else lo = mid; } t = hi; }
  }
  let s = solveS(1, t);
  if (metricsAt(s, 1, 1, t).h > availH) {
    if (hAt(1, vFloor(1), 1) <= availH) {
      if (hAt(t, vFloor(t), 1) > availH) { let lo = t, hi = 1; for (let i = 0; i < 8; i++) { const mid = (lo + hi) / 2; if (hAt(mid, vFloor(mid), 1) <= availH) hi = mid; else lo = mid; } t = hi; s = solveS(1, t); }
      let a = vFloor(t), b = 1; // least squash that fits
      for (let i = 0; i < 8; i++) { const mid = (a + b) / 2; if (metricsAt(s, 1, mid, t).h <= availH) a = mid; else b = mid; }
      v = a;
    } else { // fully tightened and squashed and still too tall: shrink text, never below MINFONT
      t = 1; v = VTIGHT;
      const fontAt = kk => BASE_FONT * paramsFromS(solveS(kk, 1)).bScale * kk;
      let kLo = 1;
      if (fontAt(1) > MINFONT) { let a = 0.2, b = 1; for (let i = 0; i < 8; i++) { const mid = (a + b) / 2; if (fontAt(mid) >= MINFONT) b = mid; else a = mid; } kLo = b; }
      if (kLo < 1 && hAt(1, VTIGHT, kLo) <= availH) {
        let lo = kLo, hi = 1;
        for (let i = 0; i < 8; i++) { const mid = (lo + hi) / 2; if (hAt(1, VTIGHT, mid) <= availH) lo = mid; else hi = mid; }
        k = lo;
      }
      s = solveS(k, 1);
    }
  }

  const { gScale, bScale: bs } = paramsFromS(s);
  const bScale = bs * k;
  const NH   = BASE_NH * bScale * (1 - 0.3 * t);
  const LH   = Math.max(BASE_LH * bScale * v, isMobile ? 0 : NH + MINLINE);
  const SGAP = BASE_SGAP * bScale;
  const FONT = BASE_FONT * bScale;
  const GAP  = Math.max(4, BASE_GAP * gScale);
  function nw(lbl) { return nwAt(lbl, bScale, t); }

  // final layout at the chosen scale. this one sets the real positions.
  const { minX, maxX, maxY } = layoutTree(visRoot, LH, NH, SGAP, MAX_CLUSTER_COLS, nw, labelOf, GAP);

  const contentW = maxX - minX;
  const sidePad = Math.max(GUTTER, (200 - contentW) / 2); // even padding when the 200px floor kicks in for tiny trees
  const VW = contentW + sidePad * 2;
  const VH = maxY + 20;
  function px(n) { return n.lx - minX + sidePad; }
  function py(n) { return n.absY; }

  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function onTargetPath(n) { return n.isTarget || n.children.some(c => onTargetPath(c)); }

  const firstRender = drawnNodes === null;
  if (firstRender) drawnNodes = new Set();

  const skipReposition = !firstRender && S.guesses.length <= 1; // the first guess is a reveal, not a reposition
  const oldPositions = skipReposition ? null : prevPositions;
  let edges = '', nodes = '';
  let newChainIdx = 0; // +1 per new edge, root to leaf
  const tweenNodeQueue = []; // existing nodes that moved or resized
  const tweenEdgeQueue = []; // existing edges whose ends or width changed
  const newEdgeFollowQueue = []; // new edges growing from an existing (maybe still moving) parent

  const leafCounts = new Map();
  (function countLeaves(n) {
    if (n.children.length === 0) { leafCounts.set(n, 1); return 1; }
    let s = 0;
    n.children.forEach(c => { s += countLeaves(c); });
    leafCounts.set(n, s);
    return s;
  })(visRoot);
  const MIN_EW = 1.6 * bScale, MAX_EW = 7 * bScale;
  // widths scale against a fixed reference count, not the visible total. against the live total the trunk edge
  // would be max thickness from guess one. this way every edge starts thin and thickens as more genera show up.
  const EW_REFERENCE = 12;
  function edgeWidth(n) { return MIN_EW + (MAX_EW - MIN_EW) * Math.sqrt(Math.min(1, leafCounts.get(n) / EW_REFERENCE)); }

  function draw(n, incomingChainIdx) {
    const x = px(n), y = py(n);
    const existedBefore = drawnNodes.has(n.name) && !firstRender;
    const prevSelf = (existedBefore && oldPositions) ? oldPositions.get(n.name) : null;

    for (const c of n.children) {
      const cx = px(c), cy = py(c);
      const edgeNew = !drawnNodes.has(c.name) && !firstRender;
      const chainIdx = edgeNew ? newChainIdx++ : null;
      const chainAttr = chainIdx !== null ? ' data-chain="' + chainIdx + '"' : '';
      const prevChild = (!edgeNew && oldPositions) ? oldPositions.get(c.name) : null;
      const edgeMoved = !edgeNew && prevSelf && prevChild;
      const curEW = edgeWidth(c);

      // moving edges draw at their old shape first (no flash), then tween. new edges grow in with stroke-dashoffset
      // and use their final width right away.
      const ex = edgeMoved ? prevSelf.x : x, ey = edgeMoved ? prevSelf.y : y, enh = edgeMoved ? prevSelf.h : NH;
      const ecx = edgeMoved ? prevChild.x : cx, ecy = edgeMoved ? prevChild.y : cy, ech = edgeMoved ? prevChild.h : NH;
      const ew = (edgeMoved && prevChild.ew != null) ? prevChild.ew : curEW;
      const emy = (ey + enh/2 + ecy - ech/2) / 2;
      edges += '<path d="M' + ex + ',' + (ey+enh/2) + ' C' + ex + ',' + emy + ' ' + ecx + ',' + emy + ' ' + ecx + ',' + (ecy-ech/2) + '" style="stroke-width:' + ew.toFixed(2) + '" class="edge' + (edgeNew ? ' enew' : '') + (onTargetPath(c) ? ' epath' : '') + '"' + chainAttr + ' data-ekey="' + esc(c.name) + '"/>';
      if (edgeMoved) {
        tweenEdgeQueue.push({ key: c.name, prevN: prevSelf, prevC: prevChild, curN: { x, y, h: NH }, curC: { x: cx, y: cy, h: NH }, prevEW: prevChild.ew != null ? prevChild.ew : curEW, curEW });
      } else if (edgeNew && prevSelf) {
        // parent already existed (maybe mid-tween), so keep this line's start glued to the parent's current position
        // every frame. the child end is new and stays fixed.
        newEdgeFollowQueue.push({ key: c.name, prevN: prevSelf, curN: { x, y, h: NH }, childX: cx, childY: cy, childH: NH });
      }
      draw(c, chainIdx);
    }

    let bc = 'sn', tc = 'st';
    const isTip = n.isTarget;
    if      (isTip && S.won)   { bc = 'wn'; tc = 'wt'; }
    else if (isTip && S.over)  { bc = 'ln'; tc = 'lt'; }
    else if (isTip)            { bc = 'tn'; tc = 'tt'; }
    else if (n.isLeaf)         { bc = 'bn'; tc = 'bt'; }
    else if (onTargetPath(n))  { bc = 'pn'; }

    const lbl = (isTip && (S.won || S.over)) ? S.target.name : n.name;
    const w = nw(lbl);
    const isNew = !existedBefore;
    const anim = isNew ? ' nnew' : '';
    const nodeMoved = !isNew && prevSelf && (prevSelf.x !== x || prevSelf.y !== y || prevSelf.w !== w || prevSelf.h !== NH || prevSelf.font !== FONT);
    // a node's reveal follows the chain index of the edge growing into it
    const nodeChainAttr = (isNew && incomingChainIdx !== null) ? ' data-chain="' + incomingChainIdx + '"' : '';
    const keyAttr = ' data-key="' + esc(n.name) + '"';

    // moving nodes draw at their old position/size/font first so the first paint matches, then tween
    const rx = nodeMoved ? prevSelf.x : x, ry = nodeMoved ? prevSelf.y : y;
    const rw = nodeMoved ? prevSelf.w : w, rh = nodeMoved ? prevSelf.h : NH;
    const rf = nodeMoved ? prevSelf.font : FONT;
    nodes += '<rect x="' + (rx-rw/2) + '" y="' + ry + '" width="' + rw + '" height="' + rh + '" rx="3" class="' + bc + anim + '"' + nodeChainAttr + keyAttr + '/>';
    nodes += '<text x="' + rx + '" y="' + (ry+rh/2) + '" text-anchor="middle" dominant-baseline="middle" class="' + tc + anim + '" font-size="' + rf.toFixed(1) + '"' + nodeChainAttr + keyAttr + '>' + esc(lbl) + '</text>';
    if (nodeMoved) {
      tweenNodeQueue.push({ key: n.name, prev: prevSelf, cur: { x, y, w, h: NH, font: FONT } });
    }
  }

  draw(visRoot, null);

  // snapshot positions for the next render's tween, and note which nodes have been drawn (grow-in vs move)
  const newPositions = new Map();
  function collect(n) {
    drawnNodes.add(n.name);
    newPositions.set(n.name, { x: px(n), y: py(n), w: nw(labelOf(n)), h: NH, font: FONT, ew: edgeWidth(n) });
    n.children.forEach(collect);
  }
  collect(visRoot);
  prevPositions = newPositions;

  const svg = document.getElementById('tree-svg');
  svg.setAttribute('viewBox', '0 0 ' + VW + ' ' + VH);
  svg.setAttribute('width', VW);
  svg.setAttribute('height', VH);
  svg.innerHTML = edges + nodes;

  // grow new edges from parent to child along the curve. each edge waits for its parent's edge (same chain),
  // so a lower clade's line never starts before the branch above it finishes.
  const EDGE_S = 0.85;   // seconds per edge
  const NODE_S = 0.4;    // seconds for a node fade-in
  svg.querySelectorAll('path.enew').forEach(path => {
    const idx = Number(path.dataset.chain);
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    path.getBoundingClientRect(); // force a reflow so the start state sticks
    path.style.transition = 'stroke-dashoffset ' + EDGE_S + 's ease';
    path.style.transitionDelay = (idx * EDGE_S) + 's';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => { path.style.strokeDashoffset = '0'; });
    });
  });

  // nodes fade in (no movement) as the edge feeding them lands
  svg.querySelectorAll('.nnew').forEach(el => {
    const idx = el.dataset.chain !== undefined ? Number(el.dataset.chain) : 0;
    el.style.transition = 'opacity ' + NODE_S + 's ease';
    el.style.transitionDelay = ((idx + 1) * EDGE_S) + 's';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => { el.style.opacity = '1'; });
    });
  });

  // everything that already existed slides/resizes into place instead of jumping, which is how the tree
  // makes room for new growth. new nodes and edges keep the grow/fade-in above. (draw() already rendered
  // these at their old spot, so no flash.)
  const dimsChanged = !skipReposition && prevVW !== null && (prevVW !== VW || prevVH !== VH);
  if (tweenNodeQueue.length > 0 || tweenEdgeQueue.length > 0 || newEdgeFollowQueue.length > 0 || dimsChanged) {
    const rectByKey = {}, textByKey = {}, edgeByKey = {};
    svg.querySelectorAll('rect[data-key]').forEach(el => { rectByKey[el.getAttribute('data-key')] = el; });
    svg.querySelectorAll('text[data-key]').forEach(el => { textByKey[el.getAttribute('data-key')] = el; });
    svg.querySelectorAll('path[data-ekey]').forEach(el => { edgeByKey[el.getAttribute('data-ekey')] = el; });

    const tweenNodes = tweenNodeQueue.map(tn => ({ ...tn, rectEl: rectByKey[tn.key], textEl: textByKey[tn.key] }))
      .filter(tn => tn.rectEl || tn.textEl);
    const tweenEdges = tweenEdgeQueue.map(te => ({ ...te, pathEl: edgeByKey[te.key] }))
      .filter(te => te.pathEl);
    const followEdges = newEdgeFollowQueue.map(fe => ({ ...fe, pathEl: edgeByKey[fe.key] }))
      .filter(fe => fe.pathEl);

    // the canvas starts at its old size and tweens to the new one along with everything else
    if (dimsChanged) {
      svg.setAttribute('viewBox', '0 0 ' + prevVW + ' ' + prevVH);
      svg.setAttribute('width', prevVW);
      svg.setAttribute('height', prevVH);
    }

    if (tweenNodes.length > 0 || tweenEdges.length > 0 || followEdges.length > 0 || dimsChanged) {
      const DURATION = 1000;
      const t0 = performance.now();
      const ease = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; // easeInOutQuad
      let stopped = false;

      function apply(e) {
        tweenNodes.forEach(tn => {
          const x = tn.prev.x + (tn.cur.x - tn.prev.x) * e;
          const y = tn.prev.y + (tn.cur.y - tn.prev.y) * e;
          const w = tn.prev.w + (tn.cur.w - tn.prev.w) * e;
          const h = tn.prev.h + (tn.cur.h - tn.prev.h) * e;
          const f = tn.prev.font + (tn.cur.font - tn.prev.font) * e;
          if (tn.rectEl) {
            tn.rectEl.setAttribute('x', x - w/2);
            tn.rectEl.setAttribute('y', y);
            tn.rectEl.setAttribute('width', w);
            tn.rectEl.setAttribute('height', h);
          }
          if (tn.textEl) {
            tn.textEl.setAttribute('x', x);
            tn.textEl.setAttribute('y', y + h/2);
            tn.textEl.setAttribute('font-size', f.toFixed(1));
          }
        });
        tweenEdges.forEach(te => {
          const nx = te.prevN.x + (te.curN.x - te.prevN.x) * e;
          const ny = te.prevN.y + (te.curN.y - te.prevN.y) * e;
          const nh = te.prevN.h + (te.curN.h - te.prevN.h) * e;
          const cx = te.prevC.x + (te.curC.x - te.prevC.x) * e;
          const cy = te.prevC.y + (te.curC.y - te.prevC.y) * e;
          const ch = te.prevC.h + (te.curC.h - te.prevC.h) * e;
          const ew = te.prevEW + (te.curEW - te.prevEW) * e;
          const my = (ny + nh/2 + cy - ch/2) / 2;
          te.pathEl.setAttribute('d', 'M' + nx + ',' + (ny+nh/2) + ' C' + nx + ',' + my + ' ' + cx + ',' + my + ' ' + cx + ',' + (cy-ch/2));
          te.pathEl.style.strokeWidth = ew.toFixed(2);
        });
        followEdges.forEach(fe => {
          // parent end follows its own tween, child end (new) is fixed
          const nx = fe.prevN.x + (fe.curN.x - fe.prevN.x) * e;
          const ny = fe.prevN.y + (fe.curN.y - fe.prevN.y) * e;
          const nh = fe.prevN.h + (fe.curN.h - fe.prevN.h) * e;
          const my = (ny + nh/2 + fe.childY - fe.childH/2) / 2;
          fe.pathEl.setAttribute('d', 'M' + nx + ',' + (ny+nh/2) + ' C' + nx + ',' + my + ' ' + fe.childX + ',' + my + ' ' + fe.childX + ',' + (fe.childY-fe.childH/2));
        });
        if (dimsChanged) {
          const vw = prevVW + (VW - prevVW) * e;
          const vh = prevVH + (VH - prevVH) * e;
          svg.setAttribute('viewBox', '0 0 ' + vw + ' ' + vh);
          svg.setAttribute('width', vw);
          svg.setAttribute('height', vh);
        }
      }

      function frame(now) {
        if (stopped || myGen !== renderGen) return;
        const raw = Math.min(1, (now - t0) / DURATION);
        apply(ease(raw));
        if (raw < 1) requestAnimationFrame(frame);
        else activeTweenFinish = null; // finished on its own
      }
      activeTweenFinish = () => { stopped = true; apply(1); }; // called if a new guess interrupts this tween
      requestAnimationFrame(frame);
    }
  }

  prevVW = VW; prevVH = VH;

  // after a guess, scroll so the start of the new growth sits near the top of the tree area. simpler than working
  // out what the keyboard hides, and since the keyboard covers the bottom, new growth at the top clears it too.
  if (!firstRender) {
    const newYs = [];
    svg.querySelectorAll('.nnew').forEach(el => {
      const yAttr = el.getAttribute('y');
      if (yAttr !== null) newYs.push(parseFloat(yAttr));
    });
    if (newYs.length > 0) {
      const newTop = Math.min(...newYs);
      const PAD = 20;
      // wait a moment: the keyboard collapse animates for ~200ms and scrolling sooner measures the keyboard-up layout
      setTimeout(() => {
        treeWrapEl.scrollTo({ top: Math.max(0, newTop - PAD), behavior: 'smooth' });
      }, 150);
    }
  }
}

Auroraceratops","Camptosaurus","Dacentrurus","Diabloceratops","Equijubus","Gastonia","Gonkoken","Gryposaurus","Hylaeosaurus","Iani","Jakapil","Koshisaurus","Lanzhousaurus","Malefica","Menefeeceratops","Minqaria","Nasutoceratops","Olorotitan","Pachycephalosaurus","Planicoxa","Polacanthus","Saurolophus","Spicomellus","Stegoceras","Stegouros","Talenkauen","Tethyshadros","Tlatolophus","Utahceratops","Vectipelta","Yingshanosaurus","Zalmoxes","Giganotosaurus","Hadrosaurus","Giraffatitan","Ahshislesaurus","Ahvaytum","Alpkarakush","Anteavis","Archaeocursor","Asiatyrannus","Astigmasaura","Athenar","Australovenator","Baiyinosaurus","Baminornis","Bicharracosaurus","Brontotholus","Caletodraco","Campananeyen","Cariocecus","Caudipteryx","Chadititan","Chilesaurus","Chromeornis","Cienciargentina","Coahuilasaurus","Comptonatus","Dasosaurus","Doolysaurus","Duonychus","Dzharacursor","Emiliasaura","Enigmacursor","Ferenceratops","Foskeia","Gongshuilong","Haolong","Harenadraco","Hesperonyx","Huadanosaurus","Huashanosaurus","Huaxiazhoulong","Huayracursor","Hypnovenator","Istiorachis","Jaculinykus","Jinchuanloong","Joaquinraptor","Khankhuuluu","Kiyacursor","Koleken","Kryptohadros","Kunpengornis","Limenavis","Lokiceratops","Nagatitan","Neobohaiornis","Obelignathus","Parasaurolophus","Paulodon","Pelecanimimus","Petrustitan","Phosphatotitan","Prenocephale","Ptychotherates","Pulaosaurus","Qianjiangsaurus","Rebbachisaurus","Sasayamagnomus","Styracosaurus","Taleta","Tameryraptor","Tietasaura","Tongnanlong","Uragasaurus","Vitosaura","Wudingloong","Xenovenator","Xiangyunloong","Yeneen","Yuanmouraptor","Yuanyanglong","Zavacephale","Zhengheornis","Fona","Kank"]);

// "N guesses [+ H hints]", used by the victory text, the share text and the high score rows
function formatGuessHintPhrase(n, hints) {
  return n + ' guess' + (n!==1?'es':'') +
    (hints > 0 ? ' + ' + hints + ' hint' + (hints>1?'s':'') : '');
}
function guessCount() { return S.guesses.length + (S.won ? 1 : 0); } // the winning guess counts
function guessHintPhrase() { return formatGuessHintPhrase(guessCount(), S.hints); }

// some names ("Micropachycephalosaurus", "Bustingorrytitan") are too long for the dialog title at the clamp() size.
// shrink one px at a time until it fits on one line, down to MIN_TITLE_PX (the CSS ellipsis covers anything longer).
const MIN_TITLE_PX = 13;
function fitVictoryTitle() {
  const el = document.getElementById('v-title');
  el.style.fontSize = '';
  let size = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth && size > MIN_TITLE_PX) {
    size -= 1;
    el.style.fontSize = size + 'px';
  }
}

// the learn-more button can wrap to 2 lines but not 3 (20+ letter names). shrink the font only as far as needed.
const MIN_LINK_PX = 11;
function fitVictoryLink() {
  const el = document.getElementById('v-link');
  el.style.fontSize = '';
  const cs = getComputedStyle(el);
  const padV = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  let size = parseFloat(cs.fontSize);
  while (size > MIN_LINK_PX) {
    const lineHeight = parseFloat(getComputedStyle(el).lineHeight);
    if (el.scrollHeight <= lineHeight * 2 + padV + 2) break;
    size -= 1;
    el.style.fontSize = size + 'px';
  }
}

// --- victory art ---
// Wikimedia's thumbnailer sometimes flattens PNG transparency onto white (Phabricator T198370), which gave the art
// white boxes. so: ask the Commons API for the 800px thumbnail and check its corners. transparent -> use it.
// white-backed or any failure -> use the full-size original, which is always clean. fetched early (after the first guess).
const ART_W = 800, artCache = {};
// no list of problem dinos. every game re-checks, so a fixed thumbnail gets used automatically
const artOriginal = name => 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(name + '_TD.png');
function loadImg(url) { return new Promise((res, rej) => { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => res(im); im.onerror = rej; im.src = url; }); }
function cornersWhite(im) { // true if all four corners are opaque white (transparency was flattened)
  const c = document.createElement('canvas'), cx = c.getContext('2d', { willReadFrequently: true }), w = im.naturalWidth, h = im.naturalHeight;
  c.width = c.height = 1;
  return [[0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1]].every(([x, y]) => {
    cx.clearRect(0, 0, 1, 1); cx.drawImage(im, x, y, 1, 1, 0, 0, 1, 1);
    const d = cx.getImageData(0, 0, 1, 1).data; return d[3] > 245 && d[0] > 247 && d[1] > 247 && d[2] > 247;
  });
}
function prepareArt(name) { // cached promise of the url for the <img>
  return artCache[name] || (artCache[name] = (async () => {
    const orig = artOriginal(name); let out = orig, how;
    try {
      const j = await (await fetch('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url&iiurlwidth=' + ART_W + '&titles=File:' + encodeURIComponent(name + '_TD.png'))).json();
      const info = Object.values(j.query.pages)[0].imageinfo[0], thumb = info.thumburl || info.url;
      if (cornersWhite(await loadImg(thumb))) how = 'original (thumbnail was white-backed)'; else { out = thumb; how = 'thumbnail'; }
    } catch (e) { how = 'original (fallback)'; }
    if (out === orig) new Image().src = orig; // start the full-size download now so it's cached by the victory screen
    console.info('Dinotree art:', how, '-', name);
    return out;
  })());
}

function showVictory() {
  const n = S.guesses.length;
  document.getElementById('v-title').textContent = S.target.name;
  fitVictoryTitle();
  const subEl = document.getElementById('v-sub');
  if (S.won && !S.practice) subEl.innerHTML = 'Found in ' + guessHintPhrase() + ' - <a href="#" id="v-board-link" onclick="showBoard(true); return false;">add to high scores</a>';
  else subEl.textContent = S.won ? ('Found in ' + guessHintPhrase() + '.') : ('You gave up after ' + n + ' guess' + (n!==1?'es':'') + '.');
  subEl.style.color = S.won ? '' : '#ff3333';

  // paleoart comes straight from Commons, so updating it there updates the game. hidden until the genus has art.
  const artEl = document.getElementById('v-art');
  const artWrap = document.getElementById('v-art-wrap');
  artWrap.style.display = 'none';
  artEl.onload = () => { artWrap.style.display = 'block'; };
  artEl.onerror = () => { artWrap.style.display = 'none'; artEl.src = ''; };
  const nm = S.target.name;
  Promise.race([prepareArt(nm), new Promise(r => setTimeout(() => r(artOriginal(nm)), 3500))]) // never wait more than 3.5s for the fast path
    .then(url => { if (S.target.name === nm) artEl.src = url; });

  const linkEl = document.getElementById('v-link');
  if (TOTALDINO_PAGES.has(S.target.name)) {
    linkEl.href = dinoUrl(S.target.name);
    linkEl.textContent = 'LEARN MORE ABOUT ' + S.target.name.toUpperCase() + ' \u2192';
  } else {
    linkEl.href = 'https://en.wikipedia.org/wiki/' + encodeURIComponent(S.target.name);
    linkEl.textContent = 'VIEW ON WIKIPEDIA \u2192';
  }
  fitVictoryLink();
  const st = loadStats(), pr = S.practice;
  document.getElementById('v-streak').textContent = pr ? '' : (S.won ? 'Current streak: ' + st.streak + (st.streak === 1 ? ' day' : ' days') : 'Streak reset') + (st.best ? ' · Best: ' + st.best : '');
  document.getElementById('v-share-row').style.display = (S.won && !pr) ? 'flex' : 'none';
  tickNext();
  document.getElementById('overlay').classList.add('show');
  if (S.won && !S.practice) getDb().catch(() => {}); // warm up Firebase so ADD SCORE is instant
  // the buttons share one row and size to their text (see #v-share-row / .share-btn CSS)
}

// spoiler free on purpose: "I got the dino in N guesses" without the genus. uses the canonical GAME_URL, not
// window.location, so shares point at the real page wherever this file runs.
// Facebook no longer takes pre-filled text from a link, so what people see is the Open Graph tags on GAME_URL
// (title, description, image in <head>), not the "quote" param.
const GAME_URL = 'https://totaldino.com/dinotree';
function shareVictory(network) {
  const text = "I got the dino in " + guessHintPhrase() + "! \ud83e\udd96";
  const shareUrl = network === 'x'
    ? 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(GAME_URL) + '&hashtags=Dinosaurs,Paleontology'
    : 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(GAME_URL) + '&quote=' + encodeURIComponent(text);
  window.open(shareUrl, '_blank', 'noopener,noreferrer');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') ['overlay','clade-overlay','board-overlay'].forEach(id => document.getElementById(id).classList.remove('show')); });
// desktop only: refit the tree when the window or iframe resizes (phones fire resize for the keyboard)
let resizeT = null;
window.addEventListener('resize', () => {
  if (!window.matchMedia('(pointer: fine)').matches) return;
  clearTimeout(resizeT); resizeT = setTimeout(() => { if (drawnNodes) renderTree(); }, 200);
});
init();
